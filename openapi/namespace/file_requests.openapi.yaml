components:
  headers:
    X-Dropbox-Request-Id:
      description: A unique identifier for the request, useful for debugging and support.
      schema:
        type: string
  parameters:
    Dropbox-API-Path-Root:
      description: 'Scopes path-based operations to a namespace (root). The value
        is a JSON serialization of the `common.PathRoot` union: `{".tag": "home"}`,
        `{".tag": "root", "root": "<namespace_id>"}`, or `{".tag": "namespace_id",
        "namespace_id": "<namespace_id>"}`. On failure the request returns 422 with
        a `common.PathRootError`.'
      in: header
      name: Dropbox-API-Path-Root
      required: false
      schema:
        type: string
    Dropbox-API-Select-Admin:
      description: Acts as the specified team admin for supported user-auth operations.
        Pass a team member ID for an admin account. When used with a team token, that
        token must also include the `team_data.member` scope.
      in: header
      name: Dropbox-API-Select-Admin
      required: false
      schema:
        type: string
    Dropbox-API-Select-User:
      description: Acts on behalf of a team member for supported user-auth operations.
        Pass a team member ID such as `dbmid:...`. When used with a team token, that
        token must also include the `team_data.member` scope.
      in: header
      name: Dropbox-API-Select-User
      required: false
      schema:
        type: string
  responses:
    "400":
      content:
        text/plain:
          schema:
            type: string
      description: Bad input parameter. Check the response body for more information.
    "401":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
      description: Bad or expired token
    "403":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessErrorResponse'
      description: The user or team account doesn't have access to the endpoint or
        feature
    409NoEndpointError:
      description: No endpoint-specific errors
      headers:
        X-Dropbox-Request-Id:
          $ref: '#/components/headers/X-Dropbox-Request-Id'
    "429":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitErrorResponse'
        text/plain:
          schema:
            type: string
      description: The app is making too many requests for the given user or team
        and is being rate limited. The app should wait for the number of seconds specified
        in the "Retry-After" response header before trying again.
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying, when provided by
            Dropbox.
          schema:
            format: int64
            type: integer
    "500":
      description: Internal server error. An error occurred on the Dropbox servers.
        Check https://status.dropbox.com/ for announcements about Dropbox service
        issues.
  schemas:
    AccessErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/auth_apiv2.AccessError'
        error_summary:
          description: A human-readable summary of the error.
          type: string
      required:
      - error_summary
      - error
      type: object
    AuthErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/auth_apiv2.AuthError'
        error_summary:
          description: A human-readable summary of the error.
          type: string
      required:
      - error_summary
      - error
      type: object
    RateLimitErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/auth_apiv2.RateLimitError'
        error_summary:
          description: A human-readable summary of the error.
          type: string
      required:
      - error_summary
      - error
      type: object
    auth_apiv2.AccessError:
      description: Error occurred because the account doesn't have permission to access
        the resource.
      oneOf:
      - $ref: '#/components/schemas/auth_apiv2.AccessError.invalid_account_type'
      - $ref: '#/components/schemas/auth_apiv2.AccessError.paper_access_denied'
      - $ref: '#/components/schemas/auth_apiv2.AccessError.team_access_denied'
      - $ref: '#/components/schemas/auth_apiv2.AccessError.no_permission'
      - $ref: '#/components/schemas/auth_apiv2.AccessError.other'
    auth_apiv2.AccessError.invalid_account_type:
      description: Current account type cannot access the resource.
      properties:
        .tag:
          enum:
          - invalid_account_type
          type: string
        invalid_account_type:
          $ref: '#/components/schemas/auth_apiv2.InvalidAccountTypeError'
      required:
      - .tag
      - invalid_account_type
      type: object
    auth_apiv2.AccessError.no_permission:
      description: Caller does not have permission to access the resource.
      properties:
        .tag:
          enum:
          - no_permission
          type: string
        no_permission:
          $ref: '#/components/schemas/auth_apiv2.NoPermissionError'
      required:
      - .tag
      - no_permission
      type: object
    auth_apiv2.AccessError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - invalid_account_type
            - no_permission
            - paper_access_denied
            - team_access_denied
          type: string
      title: Other
      type: object
    auth_apiv2.AccessError.paper_access_denied:
      description: Current account cannot access Paper.
      properties:
        .tag:
          enum:
          - paper_access_denied
          type: string
        paper_access_denied:
          $ref: '#/components/schemas/auth_apiv2.PaperAccessError'
      required:
      - .tag
      - paper_access_denied
      type: object
    auth_apiv2.AccessError.team_access_denied:
      description: Team doesn't have permission to access.
      properties:
        .tag:
          enum:
          - team_access_denied
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.AuthError:
      description: Errors occurred during authentication.
      oneOf:
      - $ref: '#/components/schemas/auth_apiv2.AuthError.invalid_access_token'
      - $ref: '#/components/schemas/auth_apiv2.AuthError.invalid_select_user'
      - $ref: '#/components/schemas/auth_apiv2.AuthError.invalid_select_admin'
      - $ref: '#/components/schemas/auth_apiv2.AuthError.user_suspended'
      - $ref: '#/components/schemas/auth_apiv2.AuthError.expired_access_token'
      - $ref: '#/components/schemas/auth_apiv2.AuthError.missing_scope'
      - $ref: '#/components/schemas/auth_apiv2.AuthError.route_access_denied'
      - $ref: '#/components/schemas/auth_apiv2.AuthError.other'
    auth_apiv2.AuthError.expired_access_token:
      description: The access token has expired.
      properties:
        .tag:
          enum:
          - expired_access_token
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.AuthError.invalid_access_token:
      description: 'The access token is invalid. This can happen if the access token
        has been revoked by Dropbox or the user. To fix this, you should re-authenticate
        the user. Note: Access tokens that are not returned exactly as provisioned
        will return this error. Be sure not to truncate or otherwise malform access
        tokens provided by Dropbox.'
      properties:
        .tag:
          enum:
          - invalid_access_token
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.AuthError.invalid_select_admin:
      description: The user specified in 'Dropbox-API-Select-Admin' is not a Dropbox
        Business team admin.
      properties:
        .tag:
          enum:
          - invalid_select_admin
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.AuthError.invalid_select_user:
      description: The user specified in 'Dropbox-API-Select-User' is no longer on
        the team.
      properties:
        .tag:
          enum:
          - invalid_select_user
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.AuthError.missing_scope:
      allOf:
      - properties:
          .tag:
            enum:
            - missing_scope
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/auth_apiv2.TokenScopeError'
      description: The access token does not have the required scope to access the
        route.
    auth_apiv2.AuthError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - expired_access_token
            - invalid_access_token
            - invalid_select_admin
            - invalid_select_user
            - missing_scope
            - route_access_denied
            - user_suspended
          type: string
      title: Other
      type: object
    auth_apiv2.AuthError.route_access_denied:
      description: The route is not available to public.
      properties:
        .tag:
          enum:
          - route_access_denied
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.AuthError.user_suspended:
      description: The user has been suspended.
      properties:
        .tag:
          enum:
          - user_suspended
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.InvalidAccountTypeError:
      oneOf:
      - $ref: '#/components/schemas/auth_apiv2.InvalidAccountTypeError.endpoint'
      - $ref: '#/components/schemas/auth_apiv2.InvalidAccountTypeError.feature'
      - $ref: '#/components/schemas/auth_apiv2.InvalidAccountTypeError.other'
    auth_apiv2.InvalidAccountTypeError.endpoint:
      description: Current account type doesn't have permission to access this endpoint.
      properties:
        .tag:
          enum:
          - endpoint
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.InvalidAccountTypeError.feature:
      description: Current account type doesn't have permission to access this feature.
      properties:
        .tag:
          enum:
          - feature
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.InvalidAccountTypeError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - endpoint
            - feature
          type: string
      title: Other
      type: object
    auth_apiv2.NoPermissionError:
      oneOf:
      - $ref: '#/components/schemas/auth_apiv2.NoPermissionError.unauthorized_account_id_usage'
      - $ref: '#/components/schemas/auth_apiv2.NoPermissionError.other'
    auth_apiv2.NoPermissionError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - unauthorized_account_id_usage
          type: string
      title: Other
      type: object
    auth_apiv2.NoPermissionError.unauthorized_account_id_usage:
      allOf:
      - properties:
          .tag:
            enum:
            - unauthorized_account_id_usage
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/auth_apiv2.UnauthorizedAccountIdUsageError'
      description: Current caller does not have permission to access the account information
        for one or more of the specified account IDs.
    auth_apiv2.PaperAccessError:
      oneOf:
      - $ref: '#/components/schemas/auth_apiv2.PaperAccessError.paper_disabled'
      - $ref: '#/components/schemas/auth_apiv2.PaperAccessError.not_paper_user'
      - $ref: '#/components/schemas/auth_apiv2.PaperAccessError.other'
    auth_apiv2.PaperAccessError.not_paper_user:
      description: The provided user has not used Paper yet.
      properties:
        .tag:
          enum:
          - not_paper_user
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.PaperAccessError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - not_paper_user
            - paper_disabled
          type: string
      title: Other
      type: object
    auth_apiv2.PaperAccessError.paper_disabled:
      description: Paper is disabled.
      properties:
        .tag:
          enum:
          - paper_disabled
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.RateLimitError:
      description: Error occurred because the app is being rate limited.
      properties:
        reason:
          $ref: '#/components/schemas/auth_apiv2.RateLimitReason'
          description: The reason why the app is being rate limited.
        retry_after:
          default: 1
          description: |-
            The number of seconds that the app should wait
             before making another request.
          format: uint64
          minimum: 0
          type: integer
      required:
      - reason
      type: object
    auth_apiv2.RateLimitReason:
      oneOf:
      - $ref: '#/components/schemas/auth_apiv2.RateLimitReason.too_many_requests'
      - $ref: '#/components/schemas/auth_apiv2.RateLimitReason.too_many_write_operations'
      - $ref: '#/components/schemas/auth_apiv2.RateLimitReason.other'
    auth_apiv2.RateLimitReason.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - too_many_requests
            - too_many_write_operations
          type: string
      title: Other
      type: object
    auth_apiv2.RateLimitReason.too_many_requests:
      description: You are making too many requests in the past few minutes.
      properties:
        .tag:
          enum:
          - too_many_requests
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.RateLimitReason.too_many_write_operations:
      description: There are currently too many write operations happening in the
        user's Dropbox.
      properties:
        .tag:
          enum:
          - too_many_write_operations
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.TokenScopeError:
      properties:
        required_scope:
          description: The required scope to access the route.
          type: string
      required:
      - required_scope
      type: object
    auth_apiv2.UnauthorizedAccountIdUsageError:
      properties:
        unauthorized_account_ids:
          description: The account IDs that the caller does not have permission to
            use.
          items:
            type: string
          type: array
      required:
      - unauthorized_account_ids
      type: object
    file_requests_apiv2.CountFileRequestsError:
      description: There was an error counting the file requests.
      oneOf:
      - $ref: '#/components/schemas/file_requests_apiv2.CountFileRequestsError.disabled_for_team'
      - $ref: '#/components/schemas/file_requests_apiv2.CountFileRequestsError.other'
    file_requests_apiv2.CountFileRequestsError.disabled_for_team:
      description: This user's Dropbox Business team doesn't allow file requests.
      properties:
        .tag:
          enum:
          - disabled_for_team
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.CountFileRequestsError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - disabled_for_team
          type: string
      title: Other
      type: object
    file_requests_apiv2.CountFileRequestsResult:
      description: Result for [count](api:dropbox-api:POST/2/file_requests/count).
      examples:
      - file_request_count: 15
      properties:
        file_request_count:
          description: The number file requests owner by this user.
          format: uint64
          minimum: 0
          type: integer
      required:
      - file_request_count
      type: object
    file_requests_apiv2.CreateFileRequestArgs:
      description: Arguments for [create](api:dropbox-api:POST/2/file_requests/create).
      examples:
      - deadline:
          allow_late_uploads:
            .tag: seven_days
          deadline: "2020-10-12T17:00:00Z"
        destination: /File Requests/Homework
        title: Homework submission
      properties:
        deadline:
          anyOf:
          - $ref: '#/components/schemas/file_requests_apiv2.FileRequestDeadlineRequest'
          - type: "null"
          description: |-
            The deadline for the file request. Deadlines can only be set by
             Professional and Business accounts.
        description:
          description: A description of the file request.
          type:
          - string
          - "null"
        destination:
          $ref: '#/components/schemas/files.Path'
          description: |-
            The path of the folder in the Dropbox where uploaded files will be
             sent. For apps with the app folder permission, this will be relative to
             the app folder.
        open:
          default: true
          description: |-
            Whether or not the file request should be open. If the file request is
             closed, it will not accept any file submissions, but it can be opened
             later.
          type: boolean
        title:
          description: The title of the file request. Must not be empty.
          minLength: 1
          type: string
        video_project_id:
          description: If this request was created from video project, its id.
          type:
          - string
          - "null"
      required:
      - destination
      - title
      type: object
    file_requests_apiv2.CreateFileRequestError:
      description: There was an error creating the file request.
      oneOf:
      - $ref: '#/components/schemas/file_requests_apiv2.CreateFileRequestError.disabled_for_team'
      - $ref: '#/components/schemas/file_requests_apiv2.CreateFileRequestError.not_found'
      - $ref: '#/components/schemas/file_requests_apiv2.CreateFileRequestError.not_a_folder'
      - $ref: '#/components/schemas/file_requests_apiv2.CreateFileRequestError.app_lacks_access'
      - $ref: '#/components/schemas/file_requests_apiv2.CreateFileRequestError.no_permission'
      - $ref: '#/components/schemas/file_requests_apiv2.CreateFileRequestError.email_unverified'
      - $ref: '#/components/schemas/file_requests_apiv2.CreateFileRequestError.validation_error'
      - $ref: '#/components/schemas/file_requests_apiv2.CreateFileRequestError.no_write_permission'
      - $ref: '#/components/schemas/file_requests_apiv2.CreateFileRequestError.invalid_location'
      - $ref: '#/components/schemas/file_requests_apiv2.CreateFileRequestError.rate_limit'
      - $ref: '#/components/schemas/file_requests_apiv2.CreateFileRequestError.other'
    file_requests_apiv2.CreateFileRequestError.app_lacks_access:
      description: |-
        This file request is not accessible to this app. Apps with the app
         folder permission can only access file requests in their app folder.
      properties:
        .tag:
          enum:
          - app_lacks_access
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.CreateFileRequestError.disabled_for_team:
      description: This user's Dropbox Business team doesn't allow file requests.
      properties:
        .tag:
          enum:
          - disabled_for_team
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.CreateFileRequestError.email_unverified:
      description: |-
        This user's email address is not verified. File requests are only
         available on accounts with a verified email address. Users can verify
         their email address [here](https://www.dropbox.com/help/317).
      properties:
        .tag:
          enum:
          - email_unverified
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.CreateFileRequestError.invalid_location:
      description: File requests are not available on the specified folder.
      properties:
        .tag:
          enum:
          - invalid_location
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.CreateFileRequestError.no_permission:
      description: |-
        This user doesn't have permission to access or modify this file
         request.
      properties:
        .tag:
          enum:
          - no_permission
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.CreateFileRequestError.no_write_permission:
      description: This user doesn't have permission to edit files in a destination
        folder
      properties:
        .tag:
          enum:
          - no_write_permission
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.CreateFileRequestError.not_a_folder:
      description: The specified path is not a folder.
      properties:
        .tag:
          enum:
          - not_a_folder
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.CreateFileRequestError.not_found:
      description: This file request ID was not found.
      properties:
        .tag:
          enum:
          - not_found
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.CreateFileRequestError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - app_lacks_access
            - disabled_for_team
            - email_unverified
            - invalid_location
            - no_permission
            - no_write_permission
            - not_a_folder
            - not_found
            - rate_limit
            - validation_error
          type: string
      title: Other
      type: object
    file_requests_apiv2.CreateFileRequestError.rate_limit:
      description: |-
        The user has reached the rate limit for creating file requests. The
         limit is currently 4000 file requests total.
      properties:
        .tag:
          enum:
          - rate_limit
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.CreateFileRequestError.validation_error:
      description: |-
        There was an error validating the request. For example, the title was
         invalid, or there were disallowed characters in the destination path.
      properties:
        .tag:
          enum:
          - validation_error
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.DeleteAllClosedFileRequestsError:
      description: There was an error deleting all closed file requests.
      oneOf:
      - $ref: '#/components/schemas/file_requests_apiv2.DeleteAllClosedFileRequestsError.disabled_for_team'
      - $ref: '#/components/schemas/file_requests_apiv2.DeleteAllClosedFileRequestsError.not_found'
      - $ref: '#/components/schemas/file_requests_apiv2.DeleteAllClosedFileRequestsError.not_a_folder'
      - $ref: '#/components/schemas/file_requests_apiv2.DeleteAllClosedFileRequestsError.app_lacks_access'
      - $ref: '#/components/schemas/file_requests_apiv2.DeleteAllClosedFileRequestsError.no_permission'
      - $ref: '#/components/schemas/file_requests_apiv2.DeleteAllClosedFileRequestsError.email_unverified'
      - $ref: '#/components/schemas/file_requests_apiv2.DeleteAllClosedFileRequestsError.validation_error'
      - $ref: '#/components/schemas/file_requests_apiv2.DeleteAllClosedFileRequestsError.no_write_permission'
      - $ref: '#/components/schemas/file_requests_apiv2.DeleteAllClosedFileRequestsError.other'
    file_requests_apiv2.DeleteAllClosedFileRequestsError.app_lacks_access:
      description: |-
        This file request is not accessible to this app. Apps with the app
         folder permission can only access file requests in their app folder.
      properties:
        .tag:
          enum:
          - app_lacks_access
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.DeleteAllClosedFileRequestsError.disabled_for_team:
      description: This user's Dropbox Business team doesn't allow file requests.
      properties:
        .tag:
          enum:
          - disabled_for_team
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.DeleteAllClosedFileRequestsError.email_unverified:
      description: |-
        This user's email address is not verified. File requests are only
         available on accounts with a verified email address. Users can verify
         their email address [here](https://www.dropbox.com/help/317).
      properties:
        .tag:
          enum:
          - email_unverified
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.DeleteAllClosedFileRequestsError.no_permission:
      description: |-
        This user doesn't have permission to access or modify this file
         request.
      properties:
        .tag:
          enum:
          - no_permission
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.DeleteAllClosedFileRequestsError.no_write_permission:
      description: This user doesn't have permission to edit files in a destination
        folder
      properties:
        .tag:
          enum:
          - no_write_permission
          type: string
      required:
      - .tag
