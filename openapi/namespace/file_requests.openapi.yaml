      - cursor
      - file_requests
      - has_more
      type: object
    file_requests_apiv2.UpdateFileRequestArgs:
      description: Arguments for [update](api:dropbox-api:POST/2/file_requests/update).
      examples:
      - deadline:
          .tag: update
          update: deadline_with_grace_period
        destination: /File Requests/Homework
        id: oaCAVmEyrqYnkZX9955Y
        open: true
        title: Homework submission
      properties:
        deadline:
          anyOf:
          - $ref: '#/components/schemas/file_requests_apiv2.UpdateFileRequestDeadline'
          - type: "null"
          description: |-
            The new deadline for the file request. Deadlines can only be set by
             Professional and Business accounts.
        description:
          description: The description of the file request.
          type:
          - string
          - "null"
        destination:
          anyOf:
          - $ref: '#/components/schemas/files.Path'
          - type: "null"
          description: |-
            The new path of the folder in the Dropbox where uploaded files will be
             sent. For apps with the app folder permission, this will be relative to
             the app folder.
        id:
          $ref: '#/components/schemas/file_requests_apiv2.FileRequestId'
          description: The ID of the file request to update.
        open:
          description: Whether to set this file request as open or closed.
          type:
          - boolean
          - "null"
        title:
          description: The new title of the file request. Must not be empty.
          minLength: 1
          type:
          - string
          - "null"
      required:
      - id
      type: object
    file_requests_apiv2.UpdateFileRequestDeadline:
      default:
        .tag: no_update
      examples:
      - .tag: update
        update: deadline_with_grace_period
      oneOf:
      - $ref: '#/components/schemas/file_requests_apiv2.UpdateFileRequestDeadline.no_update'
      - $ref: '#/components/schemas/file_requests_apiv2.UpdateFileRequestDeadline.update'
    file_requests_apiv2.UpdateFileRequestDeadline.no_update:
      description: Do not change the file request's deadline.
      properties:
        .tag:
          enum:
          - no_update
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.UpdateFileRequestDeadline.update:
      description: If `null`, the file request's deadline is cleared.
      properties:
        .tag:
          enum:
          - update
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.UpdateFileRequestError:
      description: There is an error updating the file request.
      oneOf:
      - $ref: '#/components/schemas/file_requests_apiv2.UpdateFileRequestError.disabled_for_team'
      - $ref: '#/components/schemas/file_requests_apiv2.UpdateFileRequestError.not_found'
      - $ref: '#/components/schemas/file_requests_apiv2.UpdateFileRequestError.not_a_folder'
      - $ref: '#/components/schemas/file_requests_apiv2.UpdateFileRequestError.app_lacks_access'
      - $ref: '#/components/schemas/file_requests_apiv2.UpdateFileRequestError.no_permission'
      - $ref: '#/components/schemas/file_requests_apiv2.UpdateFileRequestError.email_unverified'
      - $ref: '#/components/schemas/file_requests_apiv2.UpdateFileRequestError.validation_error'
      - $ref: '#/components/schemas/file_requests_apiv2.UpdateFileRequestError.no_write_permission'
      - $ref: '#/components/schemas/file_requests_apiv2.UpdateFileRequestError.other'
    file_requests_apiv2.UpdateFileRequestError.app_lacks_access:
      description: |-
        This file request is not accessible to this app. Apps with the app
         folder permission can only access file requests in their app folder.
      properties:
        .tag:
          enum:
          - app_lacks_access
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.UpdateFileRequestError.disabled_for_team:
      description: This user's Dropbox Business team doesn't allow file requests.
      properties:
        .tag:
          enum:
          - disabled_for_team
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.UpdateFileRequestError.email_unverified:
      description: |-
        This user's email address is not verified. File requests are only
         available on accounts with a verified email address. Users can verify
         their email address [here](https://www.dropbox.com/help/317).
      properties:
        .tag:
          enum:
          - email_unverified
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.UpdateFileRequestError.no_permission:
      description: |-
        This user doesn't have permission to access or modify this file
         request.
      properties:
        .tag:
          enum:
          - no_permission
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.UpdateFileRequestError.no_write_permission:
      description: This user doesn't have permission to edit files in a destination
        folder
      properties:
        .tag:
          enum:
          - no_write_permission
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.UpdateFileRequestError.not_a_folder:
      description: The specified path is not a folder.
      properties:
        .tag:
          enum:
          - not_a_folder
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.UpdateFileRequestError.not_found:
      description: This file request ID was not found.
      properties:
        .tag:
          enum:
          - not_found
          type: string
      required:
      - .tag
      type: object
    file_requests_apiv2.UpdateFileRequestError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - app_lacks_access
            - disabled_for_team
            - email_unverified
            - no_permission
            - no_write_permission
            - not_a_folder
            - not_found
            - validation_error
          type: string
      title: Other
      type: object
    file_requests_apiv2.UpdateFileRequestError.validation_error:
      description: |-
        There was an error validating the request. For example, the title was
         invalid, or there were disallowed characters in the destination path.
      properties:
        .tag:
          enum:
          - validation_error
          type: string
      required:
      - .tag
      type: object
    files.Path:
      pattern: \/(.|[\r\n])*
      type: string
  securitySchemes:
    dropboxOAuth2:
      description: |-
        OAuth 2.0 token issued to a specific user. Use `Authorization: Bearer <token>`.

        Public clients should use the authorization code flow with PKCE (S256).

        For background or offline access, send `token_access_type=offline` during authorization and use the returned refresh token to obtain new access tokens.

        You can generate a short-lived access token in the Developer Console; see [Testing with a generated token](https://docs.dropboxapi.com/dropbox-api/docs/oauth#testing-with-a-generated-token).
      flows:
        authorizationCode:
          authorizationUrl: https://www.dropbox.com/oauth2/authorize
          scopes:
            file_requests.read: 'Required Dropbox scope: file_requests.read'
            file_requests.write: 'Required Dropbox scope: file_requests.write'
          tokenUrl: https://api.dropboxapi.com/oauth2/token
      type: oauth2
      x-fern-playground-description: You can generate a short-lived access token in
        the Developer Console; see [Testing with a generated token](https://docs.dropboxapi.com/dropbox-api/docs/oauth#testing-with-a-generated-token).
