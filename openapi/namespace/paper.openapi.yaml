paths:
  /2/paper/docs/archive:
    post:
      deprecated: true
      description: |-
        Marks the given Paper doc as archived. This action can be performed or undone by anyone with edit permissions to the doc. Note that this endpoint will continue to work for content created by users on the older version of Paper. To check which version of Paper a user is on, use /users/features/get_values. If the paper_as_files feature is enabled, then the user is running the new version of Paper. This endpoint will be retired in September 2020. Refer to the [Paper Migration Guide](https://www.dropbox.com/lp/developers/reference/paper-migration-guide) for more information.

        **Required scope:** `files.content.write`

        **Endpoint format:** [RPC](https://docs.dropboxapi.com/dropbox-api/docs/technical-reference/request-response-formats#rpc-endpoints)

        **Authentication:** [User](https://docs.dropboxapi.com/dropbox-api/docs/auth-types#user-authentication)

        This endpoint does not support apps with the app folder permission.
      operationId: paperDeprecatedDocsArchive
      parameters:
      - $ref: '#/components/parameters/Dropbox-API-Select-User'
      - $ref: '#/components/parameters/Dropbox-API-Path-Root'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/paper_apiv2.RefPaperDoc'
        required: true
      responses:
        "200":
          description: Successful response (no content)
          headers:
            X-Dropbox-Request-Id:
              $ref: '#/components/headers/X-Dropbox-Request-Id'
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "409":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: '#/components/schemas/paper_apiv2.DocLookupError'
                  error_summary:
                    description: A human-readable summary of the error.
                    type: string
                  user_message:
                    properties:
                      locale:
                        type: string
                      text:
                        type: string
                    type: object
                required:
                - error_summary
                - error
                type: object
          description: Endpoint-specific error
          headers:
            X-Dropbox-Request-Id:
              $ref: '#/components/headers/X-Dropbox-Request-Id'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
      security:
      - dropboxOAuth2:
        - files.content.write
      summary: Docs Archive
      tags:
      - paperDeprecated
      x-auth-type: user
      x-fern-availability: deprecated
  /2/paper/docs/create:
    post:
