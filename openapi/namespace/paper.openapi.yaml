components:
  headers:
    X-Dropbox-Request-Id:
      description: A unique identifier for the request, useful for debugging and support.
      schema:
        type: string
  parameters:
    Dropbox-API-Path-Root:
      description: 'Scopes path-based operations to a namespace (root). The value
        is a JSON serialization of the `common.PathRoot` union: `{".tag": "home"}`,
        `{".tag": "root", "root": "<namespace_id>"}`, or `{".tag": "namespace_id",
        "namespace_id": "<namespace_id>"}`. On failure the request returns 422 with
        a `common.PathRootError`.'
      in: header
      name: Dropbox-API-Path-Root
      required: false
      schema:
        type: string
    Dropbox-API-Select-Admin:
      description: Acts as the specified team admin for supported user-auth operations.
        Pass a team member ID for an admin account. When used with a team token, that
        token must also include the `team_data.member` scope.
      in: header
      name: Dropbox-API-Select-Admin
      required: false
      schema:
        type: string
    Dropbox-API-Select-User:
      description: Acts on behalf of a team member for supported user-auth operations.
        Pass a team member ID such as `dbmid:...`. When used with a team token, that
        token must also include the `team_data.member` scope.
      in: header
      name: Dropbox-API-Select-User
      required: false
      schema:
        type: string
  responses:
    "400":
      content:
        text/plain:
          schema:
            type: string
      description: Bad input parameter. Check the response body for more information.
    "401":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
      description: Bad or expired token
    "403":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessErrorResponse'
      description: The user or team account doesn't have access to the endpoint or
        feature
    409NoEndpointError:
      description: No endpoint-specific errors
      headers:
        X-Dropbox-Request-Id:
          $ref: '#/components/headers/X-Dropbox-Request-Id'
    "429":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitErrorResponse'
        text/plain:
          schema:
            type: string
      description: The app is making too many requests for the given user or team
        and is being rate limited. The app should wait for the number of seconds specified
        in the "Retry-After" response header before trying again.
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying, when provided by
            Dropbox.
          schema:
            format: int64
            type: integer
    "500":
      description: Internal server error. An error occurred on the Dropbox servers.
        Check https://status.dropbox.com/ for announcements about Dropbox service
        issues.
  schemas:
    AccessErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/auth_apiv2.AccessError'
        error_summary:
          description: A human-readable summary of the error.
          type: string
      required:
      - error_summary
      - error
      type: object
    AuthErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/auth_apiv2.AuthError'
        error_summary:
          description: A human-readable summary of the error.
          type: string
      required:
      - error_summary
      - error
      type: object
    RateLimitErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/auth_apiv2.RateLimitError'
        error_summary:
          description: A human-readable summary of the error.
          type: string
      required:
      - error_summary
      - error
      type: object
    auth_apiv2.AccessError:
      description: Error occurred because the account doesn't have permission to access
        the resource.
      oneOf:
      - $ref: '#/components/schemas/auth_apiv2.AccessError.invalid_account_type'
      - $ref: '#/components/schemas/auth_apiv2.AccessError.paper_access_denied'
      - $ref: '#/components/schemas/auth_apiv2.AccessError.team_access_denied'
      - $ref: '#/components/schemas/auth_apiv2.AccessError.no_permission'
      - $ref: '#/components/schemas/auth_apiv2.AccessError.other'
    auth_apiv2.AccessError.invalid_account_type:
      description: Current account type cannot access the resource.
      properties:
        .tag:
          enum:
          - invalid_account_type
          type: string
        invalid_account_type:
          $ref: '#/components/schemas/auth_apiv2.InvalidAccountTypeError'
      required:
      - .tag
      - invalid_account_type
      type: object
    auth_apiv2.AccessError.no_permission:
      description: Caller does not have permission to access the resource.
      properties:
        .tag:
          enum:
          - no_permission
          type: string
        no_permission:
          $ref: '#/components/schemas/auth_apiv2.NoPermissionError'
      required:
      - .tag
      - no_permission
      type: object
    auth_apiv2.AccessError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - invalid_account_type
            - no_permission
            - paper_access_denied
            - team_access_denied
          type: string
      title: Other
      type: object
    auth_apiv2.AccessError.paper_access_denied:
      description: Current account cannot access Paper.
      properties:
        .tag:
          enum:
          - paper_access_denied
          type: string
        paper_access_denied:
          $ref: '#/components/schemas/auth_apiv2.PaperAccessError'
      required:
      - .tag
      - paper_access_denied
      type: object
    auth_apiv2.AccessError.team_access_denied:
      description: Team doesn't have permission to access.
      properties:
        .tag:
          enum:
          - team_access_denied
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.AuthError:
      description: Errors occurred during authentication.
      oneOf:
      - $ref: '#/components/schemas/auth_apiv2.AuthError.invalid_access_token'
      - $ref: '#/components/schemas/auth_apiv2.AuthError.invalid_select_user'
      - $ref: '#/components/schemas/auth_apiv2.AuthError.invalid_select_admin'
      - $ref: '#/components/schemas/auth_apiv2.AuthError.user_suspended'
      - $ref: '#/components/schemas/auth_apiv2.AuthError.expired_access_token'
      - $ref: '#/components/schemas/auth_apiv2.AuthError.missing_scope'
      - $ref: '#/components/schemas/auth_apiv2.AuthError.route_access_denied'
      - $ref: '#/components/schemas/auth_apiv2.AuthError.other'
    auth_apiv2.AuthError.expired_access_token:
      description: The access token has expired.
      properties:
        .tag:
          enum:
          - expired_access_token
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.AuthError.invalid_access_token:
      description: 'The access token is invalid. This can happen if the access token
        has been revoked by Dropbox or the user. To fix this, you should re-authenticate
        the user. Note: Access tokens that are not returned exactly as provisioned
        will return this error. Be sure not to truncate or otherwise malform access
        tokens provided by Dropbox.'
      properties:
        .tag:
          enum:
          - invalid_access_token
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.AuthError.invalid_select_admin:
      description: The user specified in 'Dropbox-API-Select-Admin' is not a Dropbox
        Business team admin.
      properties:
        .tag:
          enum:
          - invalid_select_admin
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.AuthError.invalid_select_user:
      description: The user specified in 'Dropbox-API-Select-User' is no longer on
        the team.
      properties:
        .tag:
          enum:
          - invalid_select_user
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.AuthError.missing_scope:
      allOf:
      - properties:
          .tag:
            enum:
            - missing_scope
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/auth_apiv2.TokenScopeError'
      description: The access token does not have the required scope to access the
        route.
    auth_apiv2.AuthError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - expired_access_token
            - invalid_access_token
            - invalid_select_admin
            - invalid_select_user
            - missing_scope
            - route_access_denied
            - user_suspended
          type: string
      title: Other
      type: object
    auth_apiv2.AuthError.route_access_denied:
      description: The route is not available to public.
      properties:
        .tag:
          enum:
          - route_access_denied
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.AuthError.user_suspended:
      description: The user has been suspended.
      properties:
        .tag:
          enum:
          - user_suspended
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.InvalidAccountTypeError:
      oneOf:
      - $ref: '#/components/schemas/auth_apiv2.InvalidAccountTypeError.endpoint'
      - $ref: '#/components/schemas/auth_apiv2.InvalidAccountTypeError.feature'
      - $ref: '#/components/schemas/auth_apiv2.InvalidAccountTypeError.other'
    auth_apiv2.InvalidAccountTypeError.endpoint:
      description: Current account type doesn't have permission to access this endpoint.
      properties:
        .tag:
          enum:
          - endpoint
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.InvalidAccountTypeError.feature:
      description: Current account type doesn't have permission to access this feature.
      properties:
        .tag:
          enum:
          - feature
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.InvalidAccountTypeError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - endpoint
            - feature
          type: string
      title: Other
      type: object
    auth_apiv2.NoPermissionError:
      oneOf:
      - $ref: '#/components/schemas/auth_apiv2.NoPermissionError.unauthorized_account_id_usage'
      - $ref: '#/components/schemas/auth_apiv2.NoPermissionError.other'
    auth_apiv2.NoPermissionError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - unauthorized_account_id_usage
          type: string
      title: Other
      type: object
    auth_apiv2.NoPermissionError.unauthorized_account_id_usage:
      allOf:
      - properties:
          .tag:
            enum:
            - unauthorized_account_id_usage
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/auth_apiv2.UnauthorizedAccountIdUsageError'
      description: Current caller does not have permission to access the account information
        for one or more of the specified account IDs.
    auth_apiv2.PaperAccessError:
      oneOf:
      - $ref: '#/components/schemas/auth_apiv2.PaperAccessError.paper_disabled'
      - $ref: '#/components/schemas/auth_apiv2.PaperAccessError.not_paper_user'
      - $ref: '#/components/schemas/auth_apiv2.PaperAccessError.other'
    auth_apiv2.PaperAccessError.not_paper_user:
      description: The provided user has not used Paper yet.
      properties:
        .tag:
          enum:
          - not_paper_user
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.PaperAccessError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - not_paper_user
            - paper_disabled
          type: string
      title: Other
      type: object
    auth_apiv2.PaperAccessError.paper_disabled:
      description: Paper is disabled.
      properties:
        .tag:
          enum:
          - paper_disabled
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.RateLimitError:
      description: Error occurred because the app is being rate limited.
      properties:
        reason:
          $ref: '#/components/schemas/auth_apiv2.RateLimitReason'
          description: The reason why the app is being rate limited.
        retry_after:
          default: 1
          description: |-
            The number of seconds that the app should wait
             before making another request.
          format: uint64
          minimum: 0
          type: integer
      required:
      - reason
      type: object
    auth_apiv2.RateLimitReason:
      oneOf:
      - $ref: '#/components/schemas/auth_apiv2.RateLimitReason.too_many_requests'
      - $ref: '#/components/schemas/auth_apiv2.RateLimitReason.too_many_write_operations'
      - $ref: '#/components/schemas/auth_apiv2.RateLimitReason.other'
    auth_apiv2.RateLimitReason.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - too_many_requests
            - too_many_write_operations
          type: string
      title: Other
      type: object
    auth_apiv2.RateLimitReason.too_many_requests:
      description: You are making too many requests in the past few minutes.
      properties:
        .tag:
          enum:
          - too_many_requests
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.RateLimitReason.too_many_write_operations:
      description: There are currently too many write operations happening in the
        user's Dropbox.
      properties:
        .tag:
          enum:
          - too_many_write_operations
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.TokenScopeError:
      properties:
        required_scope:
          description: The required scope to access the route.
          type: string
      required:
      - required_scope
      type: object
    auth_apiv2.UnauthorizedAccountIdUsageError:
      properties:
        unauthorized_account_ids:
          description: The account IDs that the caller does not have permission to
            use.
          items:
            type: string
          type: array
      required:
      - unauthorized_account_ids
      type: object
    common.EmailAddress:
      maxLength: 255
      pattern: ^['#&A-Za-z0-9._%+-]+@[A-Za-z0-9-][A-Za-z0-9.-]*\.[A-Za-z]{2,15}$
      type: string
    files.FileId:
      minLength: 4
      pattern: id:.+
      type: string
    paper_apiv2.AddMember:
      examples:
      - member:
          .tag: email
          email: justin@example.com
        permission_level:
          .tag: view_and_comment
      properties:
        member:
          $ref: '#/components/schemas/sharing_apiv2.MemberSelectorRequest'
          description: User which should be added to the Paper doc. Specify only email
            address or Dropbox account ID.
        permission_level:
          anyOf:
          - $ref: '#/components/schemas/paper_apiv2.PaperDocPermissionLevelRequest'
          - type: "null"
          description: Permission for the user.
      required:
      - member
      type: object
    paper_apiv2.AddMemberList:
      items:
        $ref: '#/components/schemas/paper_apiv2.AddMember'
      maxItems: 20
      type: array
    paper_apiv2.AddPaperDocUser:
      allOf:
      - $ref: '#/components/schemas/paper_apiv2.RefPaperDoc'
      - properties:
          custom_message:
            description: A personal message that will be emailed to each successfully
              added member.
            type:
            - string
            - "null"
          members:
            $ref: '#/components/schemas/paper_apiv2.AddMemberList'
            description: User which should be added to the Paper doc. Specify only
              email address or Dropbox account ID.
          quiet:
            default: false
            description: Clients should set this to true if no email message shall
              be sent to added users.
            type: boolean
        required:
        - members
        type: object
      examples:
      - custom_message: Welcome to Paper.
        doc_id: uaSvRuxvnkFa12PTkBv5q
        members:
        - member:
            .tag: email
            email: justin@example.com
          permission_level:
            .tag: view_and_comment
    paper_apiv2.AddPaperDocUserMemberResult:
      description: Per-member result for [docs/users/add](api:dropbox-api:POST/2/paper/docs/users/add).
      properties:
        member:
          $ref: '#/components/schemas/sharing_apiv2.MemberSelector'
          description: One of specified input members.
        result:
          $ref: '#/components/schemas/paper_apiv2.AddPaperDocUserResult'
          description: The outcome of the action on this member.
      required:
      - member
      - result
      type: object
    paper_apiv2.AddPaperDocUserMemberResultList:
      description: Route result wrapper for List(AddPaperDocUserMemberResult) - used
        by docs/users/add route
      items:
        $ref: '#/components/schemas/paper_apiv2.AddPaperDocUserMemberResult'
      type: array
    paper_apiv2.AddPaperDocUserResult:
      oneOf:
      - $ref: '#/components/schemas/paper_apiv2.AddPaperDocUserResult.success'
      - $ref: '#/components/schemas/paper_apiv2.AddPaperDocUserResult.unknown_error'
      - $ref: '#/components/schemas/paper_apiv2.AddPaperDocUserResult.sharing_outside_team_disabled'
      - $ref: '#/components/schemas/paper_apiv2.AddPaperDocUserResult.daily_limit_reached'
      - $ref: '#/components/schemas/paper_apiv2.AddPaperDocUserResult.user_is_owner'
      - $ref: '#/components/schemas/paper_apiv2.AddPaperDocUserResult.failed_user_data_retrieval'
      - $ref: '#/components/schemas/paper_apiv2.AddPaperDocUserResult.permission_already_granted'
      - $ref: '#/components/schemas/paper_apiv2.AddPaperDocUserResult.other'
    paper_apiv2.AddPaperDocUserResult.daily_limit_reached:
      description: The daily limit of how many users can be added to the Paper doc
        was reached.
      properties:
        .tag:
          enum:
          - daily_limit_reached
          type: string
      required:
      - .tag
      type: object
    paper_apiv2.AddPaperDocUserResult.failed_user_data_retrieval:
      description: User data could not be retrieved. Clients should retry.
      properties:
        .tag:
          enum:
          - failed_user_data_retrieval
          type: string
      required:
      - .tag
      type: object
    paper_apiv2.AddPaperDocUserResult.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - daily_limit_reached
            - failed_user_data_retrieval
            - permission_already_granted
            - sharing_outside_team_disabled
            - success
            - unknown_error
            - user_is_owner
          type: string
      title: Other
      type: object
    paper_apiv2.AddPaperDocUserResult.permission_already_granted:
      description: This user already has the correct permission to the Paper doc.
      properties:
        .tag:
          enum:
          - permission_already_granted
          type: string
      required:
      - .tag
      type: object
    paper_apiv2.AddPaperDocUserResult.sharing_outside_team_disabled:
      description: The Paper doc can be shared only with team members.
      properties:
        .tag:
          enum:
          - sharing_outside_team_disabled
          type: string
      required:
      - .tag
      type: object
    paper_apiv2.AddPaperDocUserResult.success:
      description: User was successfully added to the Paper doc.
      properties:
        .tag:
          enum:
          - success
          type: string
      required:
      - .tag
      type: object
    paper_apiv2.AddPaperDocUserResult.unknown_error:
      description: Something unexpected happened when trying to add the user to the
        Paper doc.
      properties:
        .tag:
          enum:
          - unknown_error
          type: string
      required:
      - .tag
      type: object
    paper_apiv2.AddPaperDocUserResult.user_is_owner:
      description: Owner's permissions cannot be changed.
      properties:
        .tag:
          enum:
          - user_is_owner
          type: string
      required:
      - .tag
      type: object
    paper_apiv2.Cursor:
      examples:
      - expiration: "2016-08-07T14:56:15Z"
        value: zHZvTPBnXilGgm1AmDgVyZ10zf7qb0qznd5sAVQbbIvoteSnWLjUdLU7aR25hb
      properties:
        expiration:
          description: 'Expiration time of `value`. Some cursors might have expiration
            time assigned. This is a UTC value after which the cursor is no longer
            valid and the API starts returning an error. If cursor expires a new one
            needs to be obtained and pagination needs to be restarted. Some cursors
            might be short-lived some cursors might be long-lived. This really depends
            on the sorting type and order, e.g.: 1. on one hand, listing docs created
            by the user, sorted by the created time ascending will have undefinite
            expiration because the results cannot change while the iteration is happening.
            This cursor would be suitable for long term polling. 2. on the other hand,
            listing docs sorted by the last modified time will have a very short expiration
            as docs do get modified very often and the modified time can be changed
            while the iteration is happening thus altering the results.'
          format: date-time
          type:
          - string
          - "null"
        value:
          description: The actual cursor value.
          type: string
      required:
      - value
      type: object
    paper_apiv2.DocLookupError:
      oneOf:
      - $ref: '#/components/schemas/paper_apiv2.DocLookupError.insufficient_permissions'
      - $ref: '#/components/schemas/paper_apiv2.DocLookupError.doc_not_found'
      - $ref: '#/components/schemas/paper_apiv2.DocLookupError.folder_not_found'
      - $ref: '#/components/schemas/paper_apiv2.DocLookupError.other'
    paper_apiv2.DocLookupError.doc_not_found:
      description: The required doc was not found.
      properties:
        .tag:
          enum:
          - doc_not_found
          type: string
      required:
      - .tag
      type: object
    paper_apiv2.DocLookupError.folder_not_found:
      description: Cloud Docs do not have legacy Paper folders. Use the Dropbox filesystem
        APIs to look up their containing folders.
      properties:
        .tag:
          enum:
          - folder_not_found
          type: string
      required:
      - .tag
      type: object
    paper_apiv2.DocLookupError.insufficient_permissions:
      description: Your account does not have permissions to perform this action.
        This may be due to it only having access to Paper as files in the Dropbox
        filesystem. For more information, refer to the [Paper Migration Guide](https://www.dropbox.com/lp/developers/reference/paper-migration-guide).
      properties:
        .tag:
          enum:
          - insufficient_permissions
          type: string
      required:
      - .tag
      type: object
    paper_apiv2.DocLookupError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - doc_not_found
            - folder_not_found
            - insufficient_permissions
          type: string
      title: Other
      type: object
    paper_apiv2.ExportFormat:
      description: The desired export format of the Paper doc.
      oneOf:
      - $ref: '#/components/schemas/paper_apiv2.ExportFormat.html'
      - $ref: '#/components/schemas/paper_apiv2.ExportFormat.markdown'
      - $ref: '#/components/schemas/paper_apiv2.ExportFormat.json'
    paper_apiv2.ExportFormat.html:
      description: The HTML export format.
      properties:
        .tag:
          enum:
          - html
          type: string
      required:
      - .tag
      type: object
    paper_apiv2.ExportFormat.json:
      description: Doc metadata JSON export format.
      properties:
        .tag:
          enum:
          - json
          type: string
      required:
      - .tag
      type: object
    paper_apiv2.ExportFormat.markdown:
      description: The markdown export format.
      properties:
        .tag:
          enum:
          - markdown
          type: string
      required:
      - .tag
      type: object
    paper_apiv2.Folder:
      description: Data structure representing a Paper folder.
      examples:
      - id: e.gGYT6HSafpMej9bUv306oGm60vrHiCHgEFnzziioPGCvHf
        name: Design docs
      properties:
        id:
          description: Paper folder ID. This ID uniquely identifies the folder.
          type: string
