      properties:
        .tag:
          enum:
          - dropbox_id
          type: string
        dropbox_id:
          anyOf:
          - $ref: '#/components/schemas/sharing_apiv2.DropboxId'
          - type: "null"
      required:
      - .tag
      - dropbox_id
      type: object
    sharing_apiv2.MemberSelector.email:
      description: Email address of member.
      properties:
        .tag:
          enum:
          - email
          type: string
        email:
          anyOf:
          - $ref: '#/components/schemas/common.EmailAddress'
          - type: "null"
      required:
      - .tag
      - email
      type: object
    sharing_apiv2.MemberSelector.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - dropbox_id
            - email
          type: string
      title: Other
      type: object
    sharing_apiv2.MemberSelectorRequest:
      description: Includes different ways to identify a member of a shared folder.
      examples:
      - .tag: email
        email: justin@example.com
      - .tag: dropbox_id
        dropbox_id: dbid:AAEufNrMPSPe0dMQijRP0N_aZtBJRm26W4Q
      - .tag: dropbox_id
        dropbox_id: g:98d36ed08e6290c2e9d536a392f974ee
      oneOf:
      - $ref: '#/components/schemas/sharing_apiv2.MemberSelector.dropbox_id'
      - $ref: '#/components/schemas/sharing_apiv2.MemberSelector.email'
    sharing_apiv2.UserInfo:
      description: |-
        Basic information about a user. Use [users.get_account](api:dropbox-api:POST/2/users/get_account) and
         [users.get_account_batch](api:dropbox-api:POST/2/users/get_account_batch) to obtain more detailed information.
      examples:
      - account_id: dbid:AAH4f99T0taONIb-OurWxbNQ6ywGRopQngc
        display_name: Robert Smith
        email: bob@example.com
        same_team: true
        team_member_id: dbmid:abcd1234
      properties:
        account_id:
          $ref: '#/components/schemas/users_common.AccountId'
          description: The account ID of the user.
        display_name:
          description: The display name of the user.
          type: string
        email:
          description: Email address of user.
          type: string
        same_team:
          description: If the user is in the same team as current user.
          type: boolean
        team_member_id:
          description: |-
            The team member ID of the shared folder member. Only present if
             `same_team` is true.
          type:
          - string
          - "null"
      required:
      - account_id
      - display_name
      - email
      - same_team
      type: object
    users_common.AccountId:
      maxLength: 40
      minLength: 40
      type: string
  securitySchemes:
    dropboxOAuth2:
      description: |-
        OAuth 2.0 token issued to a specific user. Use `Authorization: Bearer <token>`.

        Public clients should use the authorization code flow with PKCE (S256).

        For background or offline access, send `token_access_type=offline` during authorization and use the returned refresh token to obtain new access tokens.

        You can generate a short-lived access token in the Developer Console; see [Testing with a generated token](https://docs.dropboxapi.com/dropbox-api/docs/oauth#testing-with-a-generated-token).
      flows:
        authorizationCode:
          authorizationUrl: https://www.dropbox.com/oauth2/authorize
          scopes:
            files.content.read: 'Required Dropbox scope: files.content.read'
            files.content.write: 'Required Dropbox scope: files.content.write'
            files.metadata.read: 'Required Dropbox scope: files.metadata.read'
            files.permanent_delete: 'Required Dropbox scope: files.permanent_delete'
            sharing.read: 'Required Dropbox scope: sharing.read'
            sharing.write: 'Required Dropbox scope: sharing.write'
          tokenUrl: https://api.dropboxapi.com/oauth2/token
      type: oauth2
      x-fern-playground-description: You can generate a short-lived access token in
        the Developer Console; see [Testing with a generated token](https://docs.dropboxapi.com/dropbox-api/docs/oauth#testing-with-a-generated-token).
