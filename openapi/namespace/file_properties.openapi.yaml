    file_properties.TemplateFilter:
      default:
        .tag: filter_none
      examples:
      - .tag: filter_none
        filter_none: null
      oneOf:
      - $ref: '#/components/schemas/file_properties.TemplateFilter.filter_some'
      - $ref: '#/components/schemas/file_properties.TemplateFilter.filter_none'
    file_properties.TemplateFilter.filter_none:
      description: No templates will be filtered from the result (all templates will
        be returned).
      properties:
        .tag:
          enum:
          - filter_none
          type: string
      required:
      - .tag
      type: object
    file_properties.TemplateFilter.filter_some:
      description: |-
        Only templates with an ID in the supplied list will be returned (a subset of
         templates will be returned).
      properties:
        .tag:
          enum:
          - filter_some
          type: string
        filter_some:
          $ref: '#/components/schemas/file_properties.TemplateIdList'
      required:
      - .tag
      - filter_some
      type: object
    file_properties.TemplateId:
      description: Core data types
      minLength: 1
      pattern: (/|ptid:).*
      type: string
    file_properties.TemplateIdList:
      items:
        $ref: '#/components/schemas/file_properties.TemplateId'
      minItems: 1
      type: array
    file_properties.UpdatePropertiesArg:
      examples:
      - path: /my_awesome/word.docx
        update_property_groups:
        - add_or_update_fields:
          - name: Security Policy
            value: Confidential
          remove_fields: []
          template_id: ptid:1a5n2i6d3OYEAAAAAAAAAYa
      properties:
        path:
          $ref: '#/components/schemas/file_properties.PathOrId'
          description: A unique identifier for the file or folder.
        update_property_groups:
          description: The property groups "delta" updates to apply.
          items:
            $ref: '#/components/schemas/file_properties.PropertyGroupUpdate'
          type: array
      required:
      - path
      - update_property_groups
      type: object
    file_properties.UpdatePropertiesError:
      oneOf:
      - $ref: '#/components/schemas/file_properties.UpdatePropertiesError.template_not_found'
      - $ref: '#/components/schemas/file_properties.UpdatePropertiesError.restricted_content'
      - $ref: '#/components/schemas/file_properties.UpdatePropertiesError.path'
      - $ref: '#/components/schemas/file_properties.UpdatePropertiesError.unsupported_folder'
      - $ref: '#/components/schemas/file_properties.UpdatePropertiesError.property_field_too_large'
      - $ref: '#/components/schemas/file_properties.UpdatePropertiesError.does_not_fit_template'
      - $ref: '#/components/schemas/file_properties.UpdatePropertiesError.duplicate_property_groups'
      - $ref: '#/components/schemas/file_properties.UpdatePropertiesError.property_group_lookup'
      - $ref: '#/components/schemas/file_properties.UpdatePropertiesError.other'
    file_properties.UpdatePropertiesError.does_not_fit_template:
      description: One or more of the supplied property fields does not conform to
        the template specifications.
      properties:
        .tag:
          enum:
          - does_not_fit_template
          type: string
      required:
      - .tag
      type: object
    file_properties.UpdatePropertiesError.duplicate_property_groups:
      description: There are 2 or more property groups referring to the same templates
        in the input.
      properties:
        .tag:
          enum:
          - duplicate_property_groups
          type: string
      required:
      - .tag
      type: object
    file_properties.UpdatePropertiesError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - does_not_fit_template
            - duplicate_property_groups
            - path
            - property_field_too_large
            - property_group_lookup
            - restricted_content
            - template_not_found
            - unsupported_folder
          type: string
      title: Other
      type: object
    file_properties.UpdatePropertiesError.path:
      properties:
        .tag:
          enum:
          - path
          type: string
        path:
          $ref: '#/components/schemas/file_properties.LookupError'
      required:
      - .tag
      - path
      type: object
    file_properties.UpdatePropertiesError.property_field_too_large:
      description: One or more of the supplied property field values is too large.
      properties:
        .tag:
          enum:
          - property_field_too_large
          type: string
      required:
      - .tag
      type: object
    file_properties.UpdatePropertiesError.property_group_lookup:
      properties:
        .tag:
          enum:
          - property_group_lookup
          type: string
        property_group_lookup:
          $ref: '#/components/schemas/file_properties.LookUpPropertiesError'
      required:
      - .tag
      - property_group_lookup
      type: object
    file_properties.UpdatePropertiesError.restricted_content:
      description: You do not have permission to modify this template.
      properties:
        .tag:
          enum:
          - restricted_content
          type: string
      required:
      - .tag
      type: object
    file_properties.UpdatePropertiesError.template_not_found:
      description: Template does not exist for the given identifier.
      properties:
        .tag:
          enum:
          - template_not_found
          type: string
        template_not_found:
          anyOf:
          - $ref: '#/components/schemas/file_properties.TemplateId'
          - type: "null"
      required:
      - .tag
      - template_not_found
      type: object
    file_properties.UpdatePropertiesError.unsupported_folder:
      description: This folder cannot be tagged. Tagging folders is not supported
        for team-owned templates.
      properties:
        .tag:
          enum:
          - unsupported_folder
          type: string
      required:
      - .tag
      type: object
    file_properties.UpdateTemplateArg:
      examples:
      - add_fields:
        - description: This is the security policy of the file or folder described.
            Policies can be Confidential, Public or Internal.
          name: Security Policy
          type:
            .tag: string
        description: These properties will describe how confidential this file or
          folder is.
        name: New Security Template Name
        template_id: ptid:1a5n2i6d3OYEAAAAAAAAAYa
      properties:
        add_fields:
          description: |-
            Property field templates to be added to the group template.
             There can be up to 32 properties in a single template.
          items:
            $ref: '#/components/schemas/file_properties.PropertyFieldTemplateRequest'
          type:
          - array
          - "null"
        description:
          description: |-
            Description for the new template. Template descriptions
             can be up to 1024 bytes.
          type:
          - string
          - "null"
        name:
          description: |-
            A display name for the template. template names can
             be up to 256 bytes.
          type:
          - string
          - "null"
        template_id:
          $ref: '#/components/schemas/file_properties.TemplateId'
          description: |-
            An identifier for template added by  See [templates/add_for_user](api:dropbox-api:POST/2/file_properties/templates/add_for_user) or
             [templates/add_for_team](api:dropbox-api:POST/2/file_properties/templates/add_for_team).
      required:
      - template_id
      type: object
    file_properties.UpdateTemplateResult:
      examples:
      - template_id: ptid:1a5n2i6d3OYEAAAAAAAAAYa
      properties:
        template_id:
          $ref: '#/components/schemas/file_properties.TemplateId'
          description: |-
            An identifier for template added by route  See [templates/add_for_user](api:dropbox-api:POST/2/file_properties/templates/add_for_user) or
             [templates/add_for_team](api:dropbox-api:POST/2/file_properties/templates/add_for_team).
      required:
      - template_id
      type: object
  securitySchemes:
    dropboxOAuth2:
      description: |-
        OAuth 2.0 token issued to a specific user. Use `Authorization: Bearer <token>`.

        Public clients should use the authorization code flow with PKCE (S256).

        For background or offline access, send `token_access_type=offline` during authorization and use the returned refresh token to obtain new access tokens.

        You can generate a short-lived access token in the Developer Console; see [Testing with a generated token](https://docs.dropboxapi.com/dropbox-api/docs/oauth#testing-with-a-generated-token).
      flows:
        authorizationCode:
          authorizationUrl: https://www.dropbox.com/oauth2/authorize
          scopes:
            files.metadata.read: 'Required Dropbox scope: files.metadata.read'
            files.metadata.write: 'Required Dropbox scope: files.metadata.write'
          tokenUrl: https://api.dropboxapi.com/oauth2/token
      type: oauth2
      x-fern-playground-description: You can generate a short-lived access token in
        the Developer Console; see [Testing with a generated token](https://docs.dropboxapi.com/dropbox-api/docs/oauth#testing-with-a-generated-token).
    dropboxTeamAuth:
      description: |-
        Team-level OAuth 2.0 token issued to a Dropbox Business admin. Use `Authorization: Bearer <token>`.

        Obtain via the authorization code flow with team-scoped permissions.

        Grants access to team-wide administrative operations.

        You can generate a short-lived access token in the Developer Console; see [Testing with a generated token](https://docs.dropboxapi.com/dropbox-api/docs/oauth#testing-with-a-generated-token).
      flows:
        authorizationCode:
          authorizationUrl: https://www.dropbox.com/oauth2/authorize
          scopes:
            files.team_metadata.write: 'Required Dropbox scope: files.team_metadata.write'
          tokenUrl: https://api.dropboxapi.com/oauth2/token
      type: oauth2
      x-fern-playground-description: You can generate a short-lived access token in
        the Developer Console; see [Testing with a generated token](https://docs.dropboxapi.com/dropbox-api/docs/oauth#testing-with-a-generated-token).
