                    $ref: '#/components/schemas/file_properties.RemovePropertiesError'
                  error_summary:
                    description: A human-readable summary of the error.
                    type: string
                  user_message:
                    properties:
                      locale:
                        type: string
                      text:
                        type: string
                    type: object
                required:
                - error_summary
                - error
                type: object
          description: Endpoint-specific error
          headers:
            X-Dropbox-Request-Id:
              $ref: '#/components/headers/X-Dropbox-Request-Id'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
      security:
      - dropboxOAuth2:
        - files.metadata.write
      summary: Properties Remove
      tags:
      - fileProperties
      x-auth-type: user
  /2/file_properties/properties/search:
    post:
      description: |-
        Search across property templates for particular property field values.

        **Required scope:** `files.metadata.read`

        **Endpoint format:** [RPC](https://docs.dropboxapi.com/dropbox-api/docs/technical-reference/request-response-formats#rpc-endpoints)

        **Authentication:** [User](https://docs.dropboxapi.com/dropbox-api/docs/auth-types#user-authentication)

