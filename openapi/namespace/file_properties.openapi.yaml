              $ref: '#/components/headers/X-Dropbox-Request-Id'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
      security:
      - dropboxOAuth2:
        - files.metadata.read
      summary: Properties Search
      tags:
      - fileProperties
      x-auth-type: user
  /2/file_properties/properties/search/continue:
