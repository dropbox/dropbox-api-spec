          .tag:
            enum:
            - missing_scope
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/auth_apiv2.TokenScopeError'
      description: The access token does not have the required scope to access the
        route.
    auth_apiv2.AuthError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - expired_access_token
            - invalid_access_token
            - invalid_select_admin
            - invalid_select_user
            - missing_scope
            - route_access_denied
            - user_suspended
          type: string
      title: Other
      type: object
    auth_apiv2.AuthError.route_access_denied:
