          description: Endpoint-specific error
          headers:
            X-Dropbox-Request-Id:
              $ref: '#/components/headers/X-Dropbox-Request-Id'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
      security:
      - dropboxOAuth2:
        - files.metadata.read
      summary: Properties Search Continue
      tags:
      - fileProperties
      x-auth-type: user
  /2/file_properties/properties/update:
    post:
      description: |-
        Add, update or remove properties associated with the supplied file and templates.
         This endpoint should be used instead of [properties/overwrite](api:dropbox-api:POST/2/file_properties/properties/overwrite) when property groups
         are being updated via a "delta" instead of via a "snapshot" . In other words, this endpoint
         will not delete any omitted fields from a property group, whereas [properties/overwrite](api:dropbox-api:POST/2/file_properties/properties/overwrite)
         will delete any fields that are omitted from a property group.

        **Required scope:** `files.metadata.write`

        **Endpoint format:** [RPC](https://docs.dropboxapi.com/dropbox-api/docs/technical-reference/request-response-formats#rpc-endpoints)

        **Authentication:** [User](https://docs.dropboxapi.com/dropbox-api/docs/auth-types#user-authentication)

        This endpoint does not support apps with the app folder permission.
      operationId: filePropertiesPropertiesUpdate
      parameters:
