paths:
  /2/file_properties/properties/add:
    post:
      description: |-
        Add property groups to a Dropbox file. See [templates/add_for_user](api:dropbox-api:POST/2/file_properties/templates/add_for_user) or
         [templates/add_for_team](api:dropbox-api:POST/2/file_properties/templates/add_for_team) to create new templates.

        **Required scope:** `files.metadata.write`

        **Endpoint format:** [RPC](https://docs.dropboxapi.com/dropbox-api/docs/technical-reference/request-response-formats#rpc-endpoints)

        **Authentication:** [User](https://docs.dropboxapi.com/dropbox-api/docs/auth-types#user-authentication)

        This endpoint does not support apps with the app folder permission.
      operationId: filePropertiesPropertiesAdd
      parameters:
      - $ref: '#/components/parameters/Dropbox-API-Select-User'
      - $ref: '#/components/parameters/Dropbox-API-Path-Root'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/file_properties.AddPropertiesArg'
        required: true
      responses:
        "200":
          description: Successful response (no content)
          headers:
            X-Dropbox-Request-Id:
              $ref: '#/components/headers/X-Dropbox-Request-Id'
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "409":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: '#/components/schemas/file_properties.AddPropertiesError'
                  error_summary:
                    description: A human-readable summary of the error.
                    type: string
                  user_message:
                    properties:
                      locale:
                        type: string
                      text:
                        type: string
                    type: object
                required:
                - error_summary
                - error
                type: object
          description: Endpoint-specific error
          headers:
            X-Dropbox-Request-Id:
              $ref: '#/components/headers/X-Dropbox-Request-Id'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
      security:
      - dropboxOAuth2:
        - files.metadata.write
      summary: Properties Add
      tags:
      - fileProperties
      x-auth-type: user
  /2/file_properties/properties/overwrite:
    post:
      description: |-
        Overwrite property groups associated with a file. This endpoint should be used
         instead of [properties/update](api:dropbox-api:POST/2/file_properties/properties/update) when property groups are being updated via a
         "snapshot" instead of via a "delta". In other words, this endpoint will delete all
         omitted fields from a property group, whereas [properties/update](api:dropbox-api:POST/2/file_properties/properties/update) will only
         delete fields that are explicitly marked for deletion.

        **Required scope:** `files.metadata.write`

        **Endpoint format:** [RPC](https://docs.dropboxapi.com/dropbox-api/docs/technical-reference/request-response-formats#rpc-endpoints)

        **Authentication:** [User](https://docs.dropboxapi.com/dropbox-api/docs/auth-types#user-authentication)

        This endpoint does not support apps with the app folder permission.
      operationId: filePropertiesPropertiesOverwrite
      parameters:
      - $ref: '#/components/parameters/Dropbox-API-Select-User'
      - $ref: '#/components/parameters/Dropbox-API-Path-Root'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/file_properties.OverwritePropertyGroupArg'
        required: true
      responses:
        "200":
          description: Successful response (no content)
          headers:
            X-Dropbox-Request-Id:
              $ref: '#/components/headers/X-Dropbox-Request-Id'
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "409":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: '#/components/schemas/file_properties.InvalidPropertyGroupError'
                  error_summary:
                    description: A human-readable summary of the error.
                    type: string
                  user_message:
                    properties:
                      locale:
                        type: string
                      text:
                        type: string
                    type: object
                required:
                - error_summary
                - error
                type: object
          description: Endpoint-specific error
          headers:
            X-Dropbox-Request-Id:
              $ref: '#/components/headers/X-Dropbox-Request-Id'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
      security:
      - dropboxOAuth2:
        - files.metadata.write
      summary: Properties Overwrite
      tags:
      - fileProperties
      x-auth-type: user
  /2/file_properties/properties/remove:
    post:
      description: |-
        Permanently removes the specified property group from the file. To remove specific property field key
         value pairs, see [properties/update](api:dropbox-api:POST/2/file_properties/properties/update).
         To update a template, see
         [templates/update_for_user](api:dropbox-api:POST/2/file_properties/templates/update_for_user) or [templates/update_for_team](api:dropbox-api:POST/2/file_properties/templates/update_for_team).
         To remove a template, see
         [templates/remove_for_user](api:dropbox-api:POST/2/file_properties/templates/remove_for_user) or [templates/remove_for_team](api:dropbox-api:POST/2/file_properties/templates/remove_for_team).

        **Required scope:** `files.metadata.write`

        **Endpoint format:** [RPC](https://docs.dropboxapi.com/dropbox-api/docs/technical-reference/request-response-formats#rpc-endpoints)

        **Authentication:** [User](https://docs.dropboxapi.com/dropbox-api/docs/auth-types#user-authentication)

        This endpoint does not support apps with the app folder permission.
      operationId: filePropertiesPropertiesRemove
