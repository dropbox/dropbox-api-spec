            schema:
              $ref: '#/components/schemas/file_properties.UpdatePropertiesArg'
        required: true
      responses:
        "200":
          description: Successful response (no content)
          headers:
            X-Dropbox-Request-Id:
              $ref: '#/components/headers/X-Dropbox-Request-Id'
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "409":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: '#/components/schemas/file_properties.UpdatePropertiesError'
                  error_summary:
                    description: A human-readable summary of the error.
                    type: string
                  user_message:
                    properties:
                      locale:
                        type: string
                      text:
                        type: string
                    type: object
                required:
                - error_summary
                - error
                type: object
          description: Endpoint-specific error
          headers:
            X-Dropbox-Request-Id:
              $ref: '#/components/headers/X-Dropbox-Request-Id'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
      security:
      - dropboxOAuth2:
        - files.metadata.write
      summary: Properties Update
      tags:
      - fileProperties
      x-auth-type: user
  /2/file_properties/templates/add_for_team:
    post:
      description: |-
        Add a template associated with a team. See [properties/add](api:dropbox-api:POST/2/file_properties/properties/add) to add properties to a file or folder.

         Note: this endpoint will create team-owned templates.

        **Required scope:** `files.team_metadata.write`

        **Endpoint format:** [RPC](https://docs.dropboxapi.com/dropbox-api/docs/technical-reference/request-response-formats#rpc-endpoints)

        **Authentication:** [Team](https://docs.dropboxapi.com/dropbox-api/docs/auth-types#team-authentication)
      operationId: filePropertiesTeamTemplatesAddForTeam
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/file_properties.AddTemplateArg'
        required: true
      responses:
        "200":
          content:
