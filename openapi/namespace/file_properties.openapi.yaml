components:
  headers:
    X-Dropbox-Request-Id:
      description: A unique identifier for the request, useful for debugging and support.
      schema:
        type: string
  parameters:
    Dropbox-API-Path-Root:
      description: 'Scopes path-based operations to a namespace (root). The value
        is a JSON serialization of the `common.PathRoot` union: `{".tag": "home"}`,
        `{".tag": "root", "root": "<namespace_id>"}`, or `{".tag": "namespace_id",
        "namespace_id": "<namespace_id>"}`. On failure the request returns 422 with
        a `common.PathRootError`.'
      in: header
      name: Dropbox-API-Path-Root
      required: false
      schema:
        type: string
    Dropbox-API-Select-Admin:
      description: Acts as the specified team admin for supported user-auth operations.
        Pass a team member ID for an admin account. When used with a team token, that
        token must also include the `team_data.member` scope.
      in: header
      name: Dropbox-API-Select-Admin
      required: false
      schema:
        type: string
    Dropbox-API-Select-User:
      description: Acts on behalf of a team member for supported user-auth operations.
        Pass a team member ID such as `dbmid:...`. When used with a team token, that
        token must also include the `team_data.member` scope.
      in: header
      name: Dropbox-API-Select-User
      required: false
      schema:
        type: string
  responses:
    "400":
      content:
        text/plain:
          schema:
            type: string
      description: Bad input parameter. Check the response body for more information.
    "401":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
      description: Bad or expired token
    "403":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessErrorResponse'
      description: The user or team account doesn't have access to the endpoint or
        feature
    409NoEndpointError:
      description: No endpoint-specific errors
      headers:
        X-Dropbox-Request-Id:
          $ref: '#/components/headers/X-Dropbox-Request-Id'
    "429":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitErrorResponse'
        text/plain:
          schema:
            type: string
      description: The app is making too many requests for the given user or team
        and is being rate limited. The app should wait for the number of seconds specified
        in the "Retry-After" response header before trying again.
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying, when provided by
            Dropbox.
          schema:
            format: int64
            type: integer
    "500":
      description: Internal server error. An error occurred on the Dropbox servers.
        Check https://status.dropbox.com/ for announcements about Dropbox service
        issues.
  schemas:
    AccessErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/auth_apiv2.AccessError'
        error_summary:
          description: A human-readable summary of the error.
          type: string
      required:
      - error_summary
      - error
      type: object
    AuthErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/auth_apiv2.AuthError'
        error_summary:
          description: A human-readable summary of the error.
          type: string
      required:
      - error_summary
      - error
      type: object
    RateLimitErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/auth_apiv2.RateLimitError'
        error_summary:
          description: A human-readable summary of the error.
          type: string
      required:
      - error_summary
      - error
      type: object
    auth_apiv2.AccessError:
      description: Error occurred because the account doesn't have permission to access
        the resource.
      oneOf:
      - $ref: '#/components/schemas/auth_apiv2.AccessError.invalid_account_type'
      - $ref: '#/components/schemas/auth_apiv2.AccessError.paper_access_denied'
      - $ref: '#/components/schemas/auth_apiv2.AccessError.team_access_denied'
      - $ref: '#/components/schemas/auth_apiv2.AccessError.no_permission'
      - $ref: '#/components/schemas/auth_apiv2.AccessError.other'
    auth_apiv2.AccessError.invalid_account_type:
      description: Current account type cannot access the resource.
      properties:
        .tag:
          enum:
          - invalid_account_type
          type: string
        invalid_account_type:
          $ref: '#/components/schemas/auth_apiv2.InvalidAccountTypeError'
      required:
      - .tag
      - invalid_account_type
      type: object
    auth_apiv2.AccessError.no_permission:
      description: Caller does not have permission to access the resource.
      properties:
        .tag:
          enum:
          - no_permission
          type: string
        no_permission:
          $ref: '#/components/schemas/auth_apiv2.NoPermissionError'
      required:
      - .tag
      - no_permission
      type: object
    auth_apiv2.AccessError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - invalid_account_type
            - no_permission
            - paper_access_denied
            - team_access_denied
          type: string
      title: Other
      type: object
    auth_apiv2.AccessError.paper_access_denied:
      description: Current account cannot access Paper.
      properties:
        .tag:
          enum:
          - paper_access_denied
          type: string
        paper_access_denied:
