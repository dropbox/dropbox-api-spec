      type: object
    riviera_api_v2.GetOcrArgs:
      description: |-
        Arguments for the asynchronous `get_ocr_async` route.

         Exactly one of `file_id`, `path`, or `url` must be supplied via
         `file_id_or_url` to identify the image or PDF whose text should be extracted
         via OCR (optical character recognition).
      examples:
      - file_id_or_url:
          .tag: path
          path: /folder/example.pdf
      properties:
        file_id_or_url:
          anyOf:
          - $ref: '#/components/schemas/riviera_api_v2.FileIdOrUrl'
          - type: "null"
          description: |-
            Identifier of the file to run OCR on. Callers must set exactly one of the
             `FileIdOrUrl` variants. OCR is supported for image files and PDFs,
             including scanned / non-text PDFs; see the route description for the
             supported formats. Requests against unsupported formats return
             `unsupported_format_error`.

             NOTE: for the `url` variant, only Dropbox shared links
             (www.dropbox.com) are supported. External (non-Dropbox) URLs are not
             supported and return `unsupported_format_error`; import the file into
             Dropbox and reference it by `file_id` or `path` instead.
      type: object
    riviera_api_v2.GetOcrAsyncCheckResult:
      description: Result type for EventBus async check - must end in "CheckResult"
      oneOf:
      - $ref: '#/components/schemas/riviera_api_v2.GetOcrAsyncCheckResult.in_progress'
      - $ref: '#/components/schemas/riviera_api_v2.GetOcrAsyncCheckResult.complete'
      - $ref: '#/components/schemas/riviera_api_v2.GetOcrAsyncCheckResult.failed'
      - $ref: '#/components/schemas/riviera_api_v2.GetOcrAsyncCheckResult.other'
    riviera_api_v2.GetOcrAsyncCheckResult.complete:
      allOf:
      - properties:
          .tag:
            enum:
            - complete
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/riviera_api_v2.GetOcrResult'
    riviera_api_v2.GetOcrAsyncCheckResult.failed:
      properties:
        .tag:
          enum:
          - failed
          type: string
        failed:
          $ref: '#/components/schemas/riviera_api_v2.OcrExtractionApiV2Error'
      required:
      - .tag
      - failed
      type: object
    riviera_api_v2.GetOcrAsyncCheckResult.in_progress:
      properties:
        .tag:
          enum:
          - in_progress
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.GetOcrAsyncCheckResult.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - complete
            - failed
            - in_progress
          type: string
      title: Other
      type: object
    riviera_api_v2.GetOcrResult:
      properties:
        hocr:
          default: ""
          description: |-
            The same content as hOCR: HTML that carries the position of every
             recognized word. Each page is a `<section>` holding `<p class="line">`
             elements with one `<span>` per word, and each element carries `data-x`,
             `data-y`, `data-width`, and `data-height` attributes in pixels relative to
             the upright page (whose dimensions are on the `<section>`). Use this when
             you need word coordinates -- to highlight matches over a page image, for
             example; use `text` when you just need the words.
          type: string
        text:
          default: ""
          description: |-
            The plain-text content extracted from the file via OCR. Words within a
             line are separated by a single space, lines are newline-separated in
             reading order, and for multi-page PDFs pages are separated by a blank line
             in page order. May be empty when no text is detected in the source.
          type: string
      type: object
    riviera_api_v2.GetTextArgs:
      description: |-
        Arguments for the asynchronous `get_text_async` route.

         Exactly one of `file_id`, `path`, or `url` must be supplied via
         `file_id_or_url` to identify the document whose plain-text content should be
         extracted.
      examples:
      - file_id_or_url:
          .tag: path
          path: /folder/example.pdf
      properties:
        file_id_or_url:
          anyOf:
          - $ref: '#/components/schemas/riviera_api_v2.FileIdOrUrl'
          - type: "null"
          description: |-
            Identifier of the document to extract text from. Callers must set exactly
             one of the `FileIdOrUrl` variants. Text extraction is supported for common
             document formats (Word, PowerPoint, Excel, PDF, RTF, and Dropbox document
             types); see the route description for the supported formats. Requests
             against unsupported formats return `unsupported_format_error`.

             NOTE: for the `url` variant, only Dropbox shared links
             (www.dropbox.com) are supported. External (non-Dropbox) URLs are not
             supported and return `unsupported_format_error`; import the file into
             Dropbox and reference it by `file_id` or `path` instead.
      type: object
    riviera_api_v2.GetTextAsyncCheckResult:
      description: Result type for EventBus async check - must end in "CheckResult"
      oneOf:
      - $ref: '#/components/schemas/riviera_api_v2.GetTextAsyncCheckResult.in_progress'
      - $ref: '#/components/schemas/riviera_api_v2.GetTextAsyncCheckResult.complete'
      - $ref: '#/components/schemas/riviera_api_v2.GetTextAsyncCheckResult.failed'
      - $ref: '#/components/schemas/riviera_api_v2.GetTextAsyncCheckResult.other'
    riviera_api_v2.GetTextAsyncCheckResult.complete:
      allOf:
      - properties:
          .tag:
            enum:
            - complete
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/riviera_api_v2.GetTextResult'
    riviera_api_v2.GetTextAsyncCheckResult.failed:
      properties:
        .tag:
          enum:
          - failed
          type: string
        failed:
          $ref: '#/components/schemas/riviera_api_v2.TextExtractionApiV2Error'
      required:
      - .tag
      - failed
      type: object
    riviera_api_v2.GetTextAsyncCheckResult.in_progress:
      properties:
        .tag:
          enum:
          - in_progress
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.GetTextAsyncCheckResult.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - complete
            - failed
            - in_progress
          type: string
      title: Other
      type: object
    riviera_api_v2.GetTextResult:
      properties:
        text:
          default: ""
          description: |-
            The plain-text content extracted from the document. For multi-page
             documents the text is concatenated in document order. May be empty when no
             text is detected in the source.
          type: string
      type: object
    riviera_api_v2.GetTranscriptArgs:
      description: |-
        Arguments for the asynchronous [get_transcript_async](api:riviera:POST/2/riviera/get_transcript_async) route.

         Exactly one of `FileIdOrUrl.file_id`, `FileIdOrUrl.path`, or
         `FileIdOrUrl.url` must be supplied via
         `GetTranscriptArgs.file_id_or_url` to identify the audio or video
         asset to transcribe.
      examples:
      - file_id_or_url:
          .tag: path
          path: /folder/example.pdf
        timestamp_level:
          .tag: sentence
      properties:
        audio_language:
          default: ""
          description: |-
            Hint for the spoken language of the source audio, as an ISO 639-1 code
             (e.g. "en", "ja"). When empty, the service auto-detects the language;
             supplying a hint improves accuracy and latency for short or ambiguous
             clips. Languages the service does not support fall back to
             auto-detection.
          type: string
        file_id_or_url:
          anyOf:
          - $ref: '#/components/schemas/riviera_api_v2.FileIdOrUrl'
          - type: "null"
          description: |-
            Identifier of the media asset to transcribe. Callers must set exactly one
             of the `FileIdOrUrl` variants. The referenced asset must be an audio
             or video file in a supported format (see the route description for the
             list); requests against files with no audio track fail with
             `ContentApiV2Error.no_audio_error`.
        included_special_words:
          default: ""
          description: |-
            Comma-delimited list of non-lexical filler words to preserve in the
             transcript output, e.g. `"uh, ah, uhm"`. By default these fillers are
             stripped. Unrecognized tokens are ignored. Leave empty to use the
             default filtering behavior.
