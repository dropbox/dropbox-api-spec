      - $ref: '#/components/schemas/riviera_api_v2.GetMetadataAsyncCheckResult.complete'
      - $ref: '#/components/schemas/riviera_api_v2.GetMetadataAsyncCheckResult.failed'
      - $ref: '#/components/schemas/riviera_api_v2.GetMetadataAsyncCheckResult.other'
    riviera_api_v2.GetMetadataAsyncCheckResult.complete:
      allOf:
      - properties:
          .tag:
