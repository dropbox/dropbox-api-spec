      description: |-
        Options for `TransformType.image` and `TransformType.image_pdf`. Supplying
         this message with any other transform type fails with
         `invalid_options_error`.
      examples:
      - page_number: 1
        scale_percent: 100
      properties:
        page_number:
          default: 1
          description: |-
            For multi-page sources (PDFs, presentations, documents), the 1-based page
             to render. Each request renders one page; to render a whole document, issue
             one request per page. Defaults to the first page when omitted.
          format: uint32
          maximum: 4294967295
          minimum: 1
          type: integer
        scale_percent:
          default: 100
          description: |-
            Scale the rendered image to this percentage of its natural size. Must be in
             (0, 100] -- the pipeline does not upscale, so values above 100 are rejected
             with `invalid_options_error`. Defaults to 100 (no scaling) when omitted.
          format: uint32
          maximum: 100
          minimum: 1
          type: integer
      type: object
    riviera_api_v2.KeyframesExtractOptions:
      description: Options for `ExtractType.keyframes`.
      examples:
      - include_images: false
        scene_change_threshold: 0.3
      properties:
        include_images:
          default: false
          description: |-
            When true, each keyframe carries its JPEG image, base64-encoded, in
             `ApiKeyframe.image_base64`. When false (the default), only timestamps and
             scene scores are returned, which keeps the result small.
          type: boolean
        scene_change_threshold:
          default: 0
          description: |-
            Sensitivity of scene-change detection. A keyframe is emitted whenever the
             frame-to-frame scene score crosses this threshold, so a LOWER value yields
             MORE keyframes. When omitted (0.0) the service uses 0.3, a good starting
             point for most videos. Values above 1.0 fail with `user_error`.
          format: double
          type: number
