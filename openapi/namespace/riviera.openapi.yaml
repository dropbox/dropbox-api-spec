      properties:
        .tag:
          not:
            enum:
            - conversion_failure_error
            - is_a_folder_error
            - limit_exceeded_error
            - link_download_disabled_error
            - no_audio_error
            - not_found_error
            - server_error
            - shared_link_password_protected
            - unsupported_format_error
            - user_error
          type: string
      title: Other
      type: object
    riviera_api_v2.ExtractApiV2Error.server_error:
      description: |-
        An unexpected, typically transient, server-side failure. The string is a
         human-readable message; retrying with backoff may succeed.
      properties:
        .tag:
          enum:
          - server_error
          type: string
        server_error:
          default: ""
          description: |-
            An unexpected, typically transient, server-side failure. The string is a
             human-readable message; retrying with backoff may succeed.
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.ExtractApiV2Error.shared_link_password_protected:
      description: |-
        `FileIdOrUrl.url` referenced a password-protected Dropbox shared link.
         Riviera cannot supply the password, so such links cannot be read.
      properties:
        .tag:
          enum:
          - shared_link_password_protected
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.ExtractApiV2Error.unsupported_format_error:
      description: |-
        The source file is not in a format the requested `extract_type`
         supports.
      properties:
        .tag:
          enum:
          - unsupported_format_error
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.ExtractApiV2Error.user_error:
      description: |-
        The request could not be processed as supplied (a problem with the
         caller's input), for example an out-of-range option. The string is a
         human-readable message; retrying the same request will not help.
      properties:
        .tag:
          enum:
          - user_error
          type: string
        user_error:
          default: ""
          description: |-
            The request could not be processed as supplied (a problem with the
             caller's input), for example an out-of-range option. The string is a
             human-readable message; retrying the same request will not help.
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.ExtractArgs:
      description: |-
        Arguments for the asynchronous `extract_async` route.

         Exactly one of `file_id`, `path`, or `url` must be supplied via
         `file_id_or_url` to identify the source file, and `extract_type` must say
         what to extract from it.
      examples:
      - extract_type:
          .tag: markdown
          embed_images: false
          enable_ocr: false
        file_id_or_url:
          .tag: path
          path: /folder/example.pdf
      - extract_type:
          .tag: transcript
          timestamp_level:
            .tag: sentence
        file_id_or_url:
          .tag: path
          path: /folder/example.pdf
      properties:
        extract_type:
          $ref: '#/components/schemas/riviera_api_v2.ExtractType'
          description: What to extract, and that extraction's options. Required.
        file_id_or_url:
          anyOf:
          - $ref: '#/components/schemas/riviera_api_v2.FileIdOrUrl'
          - type: "null"
          description: |-
            Identifier of the source file. Callers must set exactly one of the
             `FileIdOrUrl` variants. The file must be in a format the requested
             `extract_type` supports; see `ExtractType` for the per-type lists.
      required:
      - extract_type
      type: object
    riviera_api_v2.ExtractAsyncCheckResult:
      description: |-
        Status of an extraction job started by `extract_async`, as returned by
         `extract_async/check`.
      oneOf:
      - $ref: '#/components/schemas/riviera_api_v2.ExtractAsyncCheckResult.in_progress'
      - $ref: '#/components/schemas/riviera_api_v2.ExtractAsyncCheckResult.complete'
      - $ref: '#/components/schemas/riviera_api_v2.ExtractAsyncCheckResult.failed'
      - $ref: '#/components/schemas/riviera_api_v2.ExtractAsyncCheckResult.other'
    riviera_api_v2.ExtractAsyncCheckResult.complete:
      description: The job finished successfully.
      properties:
        .tag:
          enum:
          - complete
          type: string
        complete:
          $ref: '#/components/schemas/riviera_api_v2.ExtractResult'
      required:
      - .tag
      - complete
      type: object
    riviera_api_v2.ExtractAsyncCheckResult.failed:
      description: The job finished unsuccessfully.
      properties:
        .tag:
          enum:
          - failed
          type: string
        failed:
          $ref: '#/components/schemas/riviera_api_v2.ExtractApiV2Error'
      required:
      - .tag
      - failed
      type: object
    riviera_api_v2.ExtractAsyncCheckResult.in_progress:
      description: The job has not finished yet. Poll again.
      properties:
        .tag:
          enum:
          - in_progress
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.ExtractAsyncCheckResult.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - complete
            - failed
            - in_progress
          type: string
      title: Other
      type: object
    riviera_api_v2.ExtractResult:
      description: |-
        A completed extraction. The variant always matches the `ExtractType` that
         was requested.
      oneOf:
      - $ref: '#/components/schemas/riviera_api_v2.ExtractResult.markdown'
      - $ref: '#/components/schemas/riviera_api_v2.ExtractResult.text'
      - $ref: '#/components/schemas/riviera_api_v2.ExtractResult.ocr'
      - $ref: '#/components/schemas/riviera_api_v2.ExtractResult.transcript'
      - $ref: '#/components/schemas/riviera_api_v2.ExtractResult.keyframes'
      - $ref: '#/components/schemas/riviera_api_v2.ExtractResult.other'
    riviera_api_v2.ExtractResult.keyframes:
      allOf:
      - properties:
          .tag:
            enum:
            - keyframes
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/riviera_api_v2.GetKeyframesResult'
      description: The keyframes. Empty when no scene changes are detected.
    riviera_api_v2.ExtractResult.markdown:
      allOf:
      - properties:
          .tag:
            enum:
            - markdown
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/riviera_api_v2.GetMarkdownResult'
      description: |-
        The markdown the document was converted to. May be empty when the
         document has no extractable text.
    riviera_api_v2.ExtractResult.ocr:
      allOf:
      - properties:
          .tag:
            enum:
            - ocr
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/riviera_api_v2.GetOcrResult'
      description: The OCR text and hOCR. Both may be empty when no text is detected.
    riviera_api_v2.ExtractResult.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - keyframes
            - markdown
            - ocr
            - text
            - transcript
          type: string
      title: Other
      type: object
    riviera_api_v2.ExtractResult.text:
      allOf:
      - properties:
          .tag:
            enum:
            - text
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/riviera_api_v2.GetTextResult'
      description: The plain text of the document. May be empty when no text is found.
    riviera_api_v2.ExtractResult.transcript:
      allOf:
      - properties:
          .tag:
            enum:
            - transcript
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/riviera_api_v2.GetTranscriptResult'
      description: The transcript. Its segments are empty when no speech is detected.
    riviera_api_v2.ExtractType:
      description: |-
        What to extract from the source file, with that extraction's options.

         Exactly one variant must be set. Every variant carries an options message,
         so always send the object form -- for example `{".tag": "text"}` -- rather
         than a bare tag string. Option fields may be omitted to take their defaults.
      examples:
      - .tag: markdown
        embed_images: false
        enable_ocr: false
      - .tag: transcript
        timestamp_level:
          .tag: sentence
      oneOf:
      - $ref: '#/components/schemas/riviera_api_v2.ExtractType.markdown'
      - $ref: '#/components/schemas/riviera_api_v2.ExtractType.text'
      - $ref: '#/components/schemas/riviera_api_v2.ExtractType.ocr'
      - $ref: '#/components/schemas/riviera_api_v2.ExtractType.transcript'
      - $ref: '#/components/schemas/riviera_api_v2.ExtractType.keyframes'
    riviera_api_v2.ExtractType.keyframes:
      allOf:
      - properties:
          .tag:
            enum:
            - keyframes
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/riviera_api_v2.KeyframesExtractOptions'
      description: |-
        Detect scene changes in a video and return one keyframe per scene.
         Supported formats: .3gp, .3gpp, .3gpp2, .asf, .avi, .dv, .flv, .m2t,
         .m2ts, .m4v, .mkv, .mov, .mp4, .mpeg, .mpg, .mts, .mxf, .oggtheora,
         .ogv, .rm, .ts, .vob, .webm, .wmv. At most 10 GB.
    riviera_api_v2.ExtractType.markdown:
      allOf:
      - properties:
          .tag:
            enum:
            - markdown
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/riviera_api_v2.MarkdownExtractOptions'
      description: |-
        Convert a document to markdown, preserving structure such as headings,
         lists, and tables. Supported formats: .binder, .docx, .html, .paper,
         .papert, .pptx, .xlsx, .gsheet, .ods, .pdf. At most 50 MB.
    riviera_api_v2.ExtractType.ocr:
      allOf:
      - properties:
          .tag:
            enum:
            - ocr
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/riviera_api_v2.OcrExtractOptions'
      description: |-
        Run OCR on an image or a scanned PDF, returning reading-ordered text plus
         hOCR with per-word coordinates. Supported formats: .bmp, .gif, .heic,
         .jpeg, .jpg, .png, .tif, .tiff, .webp, .pdf. A PDF that already has a
         text layer is not OCRed and yields an empty result; use `text` for it.
         External (non-Dropbox) URLs are not supported.
    riviera_api_v2.ExtractType.text:
      allOf:
      - properties:
          .tag:
            enum:
            - text
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/riviera_api_v2.TextExtractOptions'
      description: |-
        Extract the plain text of a document. Supported formats: .doc, .docx,
         .docm, .rtf, .ppt, .pptx, .pptm, .xls, .xlsx, .xlsm, .pdf, .paper,
         .papert, .binder, .gdoc, .gsheet, .gslides, .txt, .vtt. At most 50 MB.
    riviera_api_v2.ExtractType.transcript:
      allOf:
      - properties:
          .tag:
            enum:
            - transcript
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/riviera_api_v2.TranscriptExtractOptions'
      description: |-
        Transcribe the audio of an audio or video file into timestamped
         segments. Supported audio formats: .aac, .aif, .aiff, .flac, .m4a, .m4r,
         .mp3, .oga, .ogg, .wav, .wma; video formats as for `keyframes`. At most
         10 GB, with at most 1 hour of audio. A file with no audio track fails
         with `no_audio_error`.
    riviera_api_v2.FileIdOrUrl:
      examples:
      - .tag: path
        path: /folder/example.pdf
      oneOf:
      - $ref: '#/components/schemas/riviera_api_v2.FileIdOrUrl.file_id'
      - $ref: '#/components/schemas/riviera_api_v2.FileIdOrUrl.url'
      - $ref: '#/components/schemas/riviera_api_v2.FileIdOrUrl.path'
    riviera_api_v2.FileIdOrUrl.file_id:
      description: |-
        A Dropbox-issued file ID for a file the authenticated user has access to,
         e.g. "id:a4ayc_80_OEAAAAAAAAAYa".
      properties:
        .tag:
          enum:
          - file_id
          type: string
        file_id:
          default: ""
          description: |-
            A Dropbox-issued file ID for a file the authenticated user has access to,
             e.g. "id:a4ayc_80_OEAAAAAAAAAYa".
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.FileIdOrUrl.path:
      description: An absolute Dropbox path, e.g. "/folder/example.pdf".
      properties:
        .tag:
          enum:
          - path
          type: string
        path:
          default: ""
          description: An absolute Dropbox path, e.g. "/folder/example.pdf".
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.FileIdOrUrl.url:
      description: |-
        Either a Dropbox shared link (www.dropbox.com) or an
         internet-accessible URL pointing to a supported file.
           - Dropbox shared links are resolved internally using the caller's
             authenticated identity and the link's visibility / download
             settings. They therefore require an authenticated user context;
             requests made with app auth alone are rejected. Password-protected
             links and links with downloads disabled are rejected as well.
           - Other URLs are fetched by Dropbox's servers, so they must be
             reachable from the public internet -- not only from the calling
             application's network -- and must point at a supported file
             extension.
      properties:
        .tag:
          enum:
          - url
          type: string
        url:
          default: ""
          description: |-
            Either a Dropbox shared link (www.dropbox.com) or an
             internet-accessible URL pointing to a supported file.
               - Dropbox shared links are resolved internally using the caller's
                 authenticated identity and the link's visibility / download
                 settings. They therefore require an authenticated user context;
                 requests made with app auth alone are rejected. Password-protected
                 links and links with downloads disabled are rejected as well.
               - Other URLs are fetched by Dropbox's servers, so they must be
                 reachable from the public internet -- not only from the calling
                 application's network -- and must point at a supported file
                 extension.
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.GetKeyframesArgs:
      description: |-
        Arguments for the asynchronous `get_keyframes_async` route.

         Exactly one of `file_id`, `path`, or `url` must be supplied via
         `file_id_or_url` to identify the video whose scene-change keyframes should be
         extracted.
      examples:
      - file_id_or_url:
          .tag: path
          path: /folder/example.pdf
        include_images: true
        scene_change_threshold: 0.3
      properties:
        file_id_or_url:
          anyOf:
          - $ref: '#/components/schemas/riviera_api_v2.FileIdOrUrl'
          - type: "null"
          description: |-
            Identifier of the video file to extract keyframes from. Callers must set
             exactly one of the `FileIdOrUrl` variants. Keyframe extraction is supported
             for video files only; see the route description for the supported formats.
             Requests against unsupported formats return `unsupported_format_error`.
        include_images:
          default: false
          description: |-
            When true, each returned keyframe includes the JPEG image bytes,
             base64-encoded, in `ApiKeyframe.image_base64`. When false, the response
             contains only per-keyframe metadata (timestamp and scene score) and
             `image_base64` is left empty -- useful when you only need the scene
             boundaries and want a small response. NOTE: because the field defaults to
             false in proto3, callers who want images must set this explicitly to true.
          type: boolean
        scene_change_threshold:
          default: 0
          description: |-
            Sensitivity of scene-change detection. A keyframe is emitted whenever the
             frame-to-frame scene score crosses this threshold, so a LOWER value yields
             MORE keyframes. Valid range is (0.0, 1.0]. When omitted (0.0) the service
             uses a default of 0.3, which is a good starting point for most videos.
          format: double
          type: number
      type: object
    riviera_api_v2.GetKeyframesAsyncCheckResult:
      description: Result type for EventBus async check - must end in "CheckResult"
      oneOf:
      - $ref: '#/components/schemas/riviera_api_v2.GetKeyframesAsyncCheckResult.in_progress'
      - $ref: '#/components/schemas/riviera_api_v2.GetKeyframesAsyncCheckResult.complete'
      - $ref: '#/components/schemas/riviera_api_v2.GetKeyframesAsyncCheckResult.failed'
      - $ref: '#/components/schemas/riviera_api_v2.GetKeyframesAsyncCheckResult.other'
    riviera_api_v2.GetKeyframesAsyncCheckResult.complete:
      allOf:
      - properties:
          .tag:
            enum:
            - complete
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/riviera_api_v2.GetKeyframesResult'
    riviera_api_v2.GetKeyframesAsyncCheckResult.failed:
      properties:
        .tag:
          enum:
          - failed
          type: string
        failed:
          $ref: '#/components/schemas/riviera_api_v2.KeyframesExtractionApiV2Error'
      required:
      - .tag
      - failed
      type: object
    riviera_api_v2.GetKeyframesAsyncCheckResult.in_progress:
      properties:
        .tag:
          enum:
          - in_progress
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.GetKeyframesAsyncCheckResult.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - complete
            - failed
            - in_progress
          type: string
      title: Other
      type: object
    riviera_api_v2.GetKeyframesResult:
      properties:
        frames:
          description: |-
            The extracted keyframes, ordered by `timestamp`. May be empty when no scene
             changes are detected in the source.
          items:
            $ref: '#/components/schemas/riviera_api_v2.ApiKeyframe'
          type:
          - array
          - "null"
      type: object
    riviera_api_v2.GetMarkdownArgs:
      description: |-
        Arguments for the asynchronous [get_markdown_async](api:riviera:POST/2/riviera/get_markdown_async) route.

         Exactly one of `FileIdOrUrl.file_id`, `FileIdOrUrl.path`, or
         `FileIdOrUrl.url` must be supplied via
         `GetMarkdownArgs.file_id_or_url` to identify the document to convert
         to markdown.
      examples:
      - embed_images: false
        enable_ocr: false
        file_id_or_url:
          .tag: path
          path: /folder/example.pdf
      properties:
        embed_images:
          default: false
          description: |-
            When true, embed images as base64 data URIs in the markdown output.
             This can significantly increase output size.
          type: boolean
        enable_ocr:
          default: false
          description: Enable OCR for PDF documents. Processing is slower when enabled.
          type: boolean
        file_id_or_url:
          anyOf:
          - $ref: '#/components/schemas/riviera_api_v2.FileIdOrUrl'
          - type: "null"
          description: |-
            Identifier of the document to convert. Callers must set exactly one of the
             `FileIdOrUrl` variants. The referenced file must be a document in a
             supported format (see the route description for the list); requests
             against unsupported formats fail with
             `MarkdownConversionApiV2Error.user_error`.
