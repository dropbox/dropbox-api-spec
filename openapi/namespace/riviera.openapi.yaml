          enum:
          - failed
          type: string
        failed:
          $ref: '#/components/schemas/riviera_api_v2.MarkdownConversionApiV2Error'
      required:
      - .tag
      - failed
      type: object
    riviera_api_v2.GetMarkdownAsyncCheckResult.in_progress:
      description: The job has not finished yet. Poll again.
