    riviera_api_v2.GetMarkdownResult:
      properties:
        markdown:
          default: ""
          description: The markdown the source document was converted to.
          type: string
      type: object
    riviera_api_v2.GetMetadataArgs:
      description: |-
        Arguments for the asynchronous [get_metadata_async](api:riviera:POST/2/riviera/get_metadata_async) route.

         Exactly one of `FileIdOrUrl.file_id`, `FileIdOrUrl.path`, or
         `FileIdOrUrl.url` must be supplied via
