components:
  headers:
    X-Dropbox-Request-Id:
      description: A unique identifier for the request, useful for debugging and support.
      schema:
        type: string
  parameters:
    Dropbox-API-Path-Root:
      description: 'Scopes path-based operations to a namespace (root). The value
        is a JSON serialization of the `common.PathRoot` union: `{".tag": "home"}`,
        `{".tag": "root", "root": "<namespace_id>"}`, or `{".tag": "namespace_id",
        "namespace_id": "<namespace_id>"}`. On failure the request returns 422 with
        a `common.PathRootError`.'
      in: header
      name: Dropbox-API-Path-Root
      required: false
      schema:
        type: string
    Dropbox-API-Select-Admin:
      description: Acts as the specified team admin for supported user-auth operations.
        Pass a team member ID for an admin account. When used with a team token, that
        token must also include the `team_data.member` scope.
      in: header
      name: Dropbox-API-Select-Admin
      required: false
      schema:
        type: string
    Dropbox-API-Select-User:
      description: Acts on behalf of a team member for supported user-auth operations.
        Pass a team member ID such as `dbmid:...`. When used with a team token, that
        token must also include the `team_data.member` scope.
      in: header
      name: Dropbox-API-Select-User
      required: false
      schema:
        type: string
  responses:
    "400":
      content:
        text/plain:
          schema:
            type: string
      description: Bad input parameter. Check the response body for more information.
    "401":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
      description: Bad or expired token
    "403":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessErrorResponse'
      description: The user or team account doesn't have access to the endpoint or
        feature
    409NoEndpointError:
      description: No endpoint-specific errors
      headers:
        X-Dropbox-Request-Id:
          $ref: '#/components/headers/X-Dropbox-Request-Id'
    "429":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitErrorResponse'
        text/plain:
          schema:
            type: string
      description: The app is making too many requests for the given user or team
        and is being rate limited. The app should wait for the number of seconds specified
        in the "Retry-After" response header before trying again.
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying, when provided by
            Dropbox.
          schema:
            format: int64
            type: integer
    "500":
      description: Internal server error. An error occurred on the Dropbox servers.
        Check https://status.dropbox.com/ for announcements about Dropbox service
        issues.
  schemas:
    AccessErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/auth_apiv2.AccessError'
        error_summary:
          description: A human-readable summary of the error.
          type: string
      required:
      - error_summary
      - error
      type: object
    AuthErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/auth_apiv2.AuthError'
        error_summary:
          description: A human-readable summary of the error.
          type: string
      required:
      - error_summary
      - error
      type: object
    RateLimitErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/auth_apiv2.RateLimitError'
        error_summary:
          description: A human-readable summary of the error.
          type: string
      required:
      - error_summary
      - error
      type: object
    async_common.AsyncJobId:
      minLength: 1
      type: string
    async_common.LaunchResultBase:
      description: |-
        Result returned by methods that launch an asynchronous job.

          A method who may either launch an asynchronous job, or complete the request
          synchronously, can use this union by extending it, and adding a 'complete' field
          with the type of the synchronous response.

          See `LaunchEmptyResult` for an example.
      examples:
      - .tag: async_job_id
        async_job_id: 34g93hh34h04y384084
      oneOf:
      - $ref: '#/components/schemas/async_common.LaunchResultBase.async_job_id'
      x-stone-union-closed: true
    async_common.LaunchResultBase.async_job_id:
      description: |-
        This response indicates that the processing is asynchronous.
         The string is an id that can be used to obtain the status of the asynchronous job.
      properties:
        .tag:
          enum:
          - async_job_id
          type: string
        async_job_id:
          anyOf:
          - $ref: '#/components/schemas/async_common.AsyncJobId'
          - type: "null"
      required:
      - .tag
      - async_job_id
      type: object
    async_common.PollArg:
      description: Arguments for methods that poll the status of an asynchronous job.
      examples:
      - async_job_id: 34g93hh34h04y384084
      properties:
        async_job_id:
          $ref: '#/components/schemas/async_common.AsyncJobId'
          description: |-
            Id of the asynchronous job.
             This is the value of a response returned from the method that launched the job.
      required:
      - async_job_id
      type: object
    async_common.PollError:
      description: Error returned by methods for polling the status of asynchronous
        job.
      oneOf:
      - $ref: '#/components/schemas/async_common.PollError.invalid_async_job_id'
      - $ref: '#/components/schemas/async_common.PollError.internal_error'
      - $ref: '#/components/schemas/async_common.PollError.other'
    async_common.PollError.internal_error:
      description: |-
        Something went wrong with the job on Dropbox's end. You'll need to
         verify that the action you were taking succeeded, and if not, try
         again. This should happen very rarely.
      properties:
        .tag:
          enum:
          - internal_error
          type: string
      required:
      - .tag
      type: object
    async_common.PollError.invalid_async_job_id:
      description: The job ID is invalid.
      properties:
        .tag:
          enum:
          - invalid_async_job_id
          type: string
      required:
      - .tag
      type: object
    async_common.PollError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - internal_error
            - invalid_async_job_id
          type: string
      title: Other
      type: object
    auth_apiv2.AccessError:
      description: Error occurred because the account doesn't have permission to access
        the resource.
      oneOf:
      - $ref: '#/components/schemas/auth_apiv2.AccessError.invalid_account_type'
      - $ref: '#/components/schemas/auth_apiv2.AccessError.paper_access_denied'
      - $ref: '#/components/schemas/auth_apiv2.AccessError.team_access_denied'
      - $ref: '#/components/schemas/auth_apiv2.AccessError.no_permission'
      - $ref: '#/components/schemas/auth_apiv2.AccessError.other'
    auth_apiv2.AccessError.invalid_account_type:
      description: Current account type cannot access the resource.
      properties:
        .tag:
          enum:
          - invalid_account_type
          type: string
        invalid_account_type:
          $ref: '#/components/schemas/auth_apiv2.InvalidAccountTypeError'
      required:
      - .tag
      - invalid_account_type
      type: object
    auth_apiv2.AccessError.no_permission:
      description: Caller does not have permission to access the resource.
      properties:
        .tag:
          enum:
          - no_permission
          type: string
        no_permission:
          $ref: '#/components/schemas/auth_apiv2.NoPermissionError'
      required:
      - .tag
      - no_permission
      type: object
    auth_apiv2.AccessError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - invalid_account_type
            - no_permission
            - paper_access_denied
            - team_access_denied
          type: string
      title: Other
      type: object
    auth_apiv2.AccessError.paper_access_denied:
      description: Current account cannot access Paper.
      properties:
        .tag:
          enum:
          - paper_access_denied
          type: string
        paper_access_denied:
          $ref: '#/components/schemas/auth_apiv2.PaperAccessError'
      required:
      - .tag
      - paper_access_denied
      type: object
    auth_apiv2.AccessError.team_access_denied:
      description: Team doesn't have permission to access.
      properties:
        .tag:
          enum:
          - team_access_denied
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.AuthError:
      description: Errors occurred during authentication.
      oneOf:
      - $ref: '#/components/schemas/auth_apiv2.AuthError.invalid_access_token'
      - $ref: '#/components/schemas/auth_apiv2.AuthError.invalid_select_user'
      - $ref: '#/components/schemas/auth_apiv2.AuthError.invalid_select_admin'
      - $ref: '#/components/schemas/auth_apiv2.AuthError.user_suspended'
      - $ref: '#/components/schemas/auth_apiv2.AuthError.expired_access_token'
      - $ref: '#/components/schemas/auth_apiv2.AuthError.missing_scope'
      - $ref: '#/components/schemas/auth_apiv2.AuthError.route_access_denied'
      - $ref: '#/components/schemas/auth_apiv2.AuthError.other'
    auth_apiv2.AuthError.expired_access_token:
      description: The access token has expired.
      properties:
        .tag:
          enum:
          - expired_access_token
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.AuthError.invalid_access_token:
      description: 'The access token is invalid. This can happen if the access token
        has been revoked by Dropbox or the user. To fix this, you should re-authenticate
        the user. Note: Access tokens that are not returned exactly as provisioned
        will return this error. Be sure not to truncate or otherwise malform access
        tokens provided by Dropbox.'
      properties:
        .tag:
          enum:
          - invalid_access_token
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.AuthError.invalid_select_admin:
      description: The user specified in 'Dropbox-API-Select-Admin' is not a Dropbox
        Business team admin.
      properties:
        .tag:
          enum:
          - invalid_select_admin
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.AuthError.invalid_select_user:
      description: The user specified in 'Dropbox-API-Select-User' is no longer on
        the team.
      properties:
        .tag:
          enum:
          - invalid_select_user
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.AuthError.missing_scope:
      allOf:
      - properties:
          .tag:
            enum:
            - missing_scope
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/auth_apiv2.TokenScopeError'
      description: The access token does not have the required scope to access the
        route.
    auth_apiv2.AuthError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - expired_access_token
            - invalid_access_token
            - invalid_select_admin
            - invalid_select_user
            - missing_scope
            - route_access_denied
            - user_suspended
          type: string
      title: Other
      type: object
    auth_apiv2.AuthError.route_access_denied:
      description: The route is not available to public.
      properties:
        .tag:
          enum:
          - route_access_denied
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.AuthError.user_suspended:
      description: The user has been suspended.
      properties:
        .tag:
          enum:
          - user_suspended
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.InvalidAccountTypeError:
      oneOf:
      - $ref: '#/components/schemas/auth_apiv2.InvalidAccountTypeError.endpoint'
      - $ref: '#/components/schemas/auth_apiv2.InvalidAccountTypeError.feature'
      - $ref: '#/components/schemas/auth_apiv2.InvalidAccountTypeError.other'
    auth_apiv2.InvalidAccountTypeError.endpoint:
      description: Current account type doesn't have permission to access this endpoint.
      properties:
        .tag:
          enum:
          - endpoint
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.InvalidAccountTypeError.feature:
      description: Current account type doesn't have permission to access this feature.
      properties:
        .tag:
          enum:
          - feature
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.InvalidAccountTypeError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - endpoint
            - feature
          type: string
      title: Other
      type: object
    auth_apiv2.NoPermissionError:
      oneOf:
      - $ref: '#/components/schemas/auth_apiv2.NoPermissionError.unauthorized_account_id_usage'
      - $ref: '#/components/schemas/auth_apiv2.NoPermissionError.other'
    auth_apiv2.NoPermissionError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - unauthorized_account_id_usage
          type: string
      title: Other
      type: object
    auth_apiv2.NoPermissionError.unauthorized_account_id_usage:
      allOf:
      - properties:
          .tag:
            enum:
            - unauthorized_account_id_usage
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/auth_apiv2.UnauthorizedAccountIdUsageError'
      description: Current caller does not have permission to access the account information
        for one or more of the specified account IDs.
    auth_apiv2.PaperAccessError:
      oneOf:
      - $ref: '#/components/schemas/auth_apiv2.PaperAccessError.paper_disabled'
      - $ref: '#/components/schemas/auth_apiv2.PaperAccessError.not_paper_user'
      - $ref: '#/components/schemas/auth_apiv2.PaperAccessError.other'
    auth_apiv2.PaperAccessError.not_paper_user:
      description: The provided user has not used Paper yet.
      properties:
        .tag:
          enum:
          - not_paper_user
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.PaperAccessError.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - not_paper_user
            - paper_disabled
          type: string
      title: Other
      type: object
    auth_apiv2.PaperAccessError.paper_disabled:
      description: Paper is disabled.
      properties:
        .tag:
          enum:
          - paper_disabled
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.RateLimitError:
      description: Error occurred because the app is being rate limited.
      properties:
        reason:
          $ref: '#/components/schemas/auth_apiv2.RateLimitReason'
          description: The reason why the app is being rate limited.
        retry_after:
          default: 1
          description: |-
            The number of seconds that the app should wait
             before making another request.
          format: uint64
          minimum: 0
          type: integer
      required:
      - reason
      type: object
    auth_apiv2.RateLimitReason:
      oneOf:
      - $ref: '#/components/schemas/auth_apiv2.RateLimitReason.too_many_requests'
      - $ref: '#/components/schemas/auth_apiv2.RateLimitReason.too_many_write_operations'
      - $ref: '#/components/schemas/auth_apiv2.RateLimitReason.other'
    auth_apiv2.RateLimitReason.other:
      description: 'An open-union catch-all: a variant added to this union after your
        API client''s spec was generated. Its ".tag" is a value not listed among the
        known variants above; treat it as an unrecognized/forward-compatible case.'
      properties:
        .tag:
          not:
            enum:
            - too_many_requests
            - too_many_write_operations
          type: string
      title: Other
      type: object
    auth_apiv2.RateLimitReason.too_many_requests:
      description: You are making too many requests in the past few minutes.
      properties:
        .tag:
          enum:
          - too_many_requests
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.RateLimitReason.too_many_write_operations:
      description: There are currently too many write operations happening in the
        user's Dropbox.
      properties:
        .tag:
          enum:
          - too_many_write_operations
          type: string
      required:
      - .tag
      type: object
    auth_apiv2.TokenScopeError:
      properties:
        required_scope:
          description: The required scope to access the route.
          type: string
      required:
      - required_scope
      type: object
    auth_apiv2.UnauthorizedAccountIdUsageError:
      properties:
        unauthorized_account_ids:
          description: The account IDs that the caller does not have permission to
            use.
          items:
            type: string
          type: array
      required:
      - unauthorized_account_ids
      type: object
    riviera_api_v2.ApiExifGpsMetadata:
      description: |-
        GPS coordinates and related tags extracted from image EXIF data. Fields are
         populated on a best-effort basis and may be empty when absent from the
         source file.
      properties:
        altitude:
          default: ""
          description: |-
            Altitude in meters, as reported by the source (string to preserve the
             original representation, which may include a reference direction).
          type: string
        datestamp:
          default: ""
          description: Date of the GPS fix, in the EXIF-provided format.
          type: string
        latitude:
          default: 0
          description: Latitude in decimal degrees (positive = north, negative = south).
          format: float
          type: number
        longitude:
          default: 0
          description: Longitude in decimal degrees (positive = east, negative = west).
          format: float
          type: number
        timestamp:
          default: ""
          description: Time of the GPS fix, in the EXIF-provided format.
          type: string
      type: object
    riviera_api_v2.ApiExifMetadata:
      description: |-
        Image EXIF metadata. Fields are populated on a best-effort basis and may be
         empty when absent from the source file.
      properties:
        aperture_value:
          default: 0
          description: Aperture the image was captured at, as reported by the EXIF
            aperture tag.
          format: double
          type: number
        artist:
          default: ""
          description: Creator credited in the EXIF artist tag.
          type: string
        camera_make:
          default: ""
          description: Manufacturer of the device that captured the image, e.g. "Apple".
          type: string
        camera_model:
          default: ""
          description: Model of the device that captured the image, e.g. "iPhone 15
            Pro".
          type: string
        copyright:
          default: ""
          description: Copyright notice from the EXIF copyright tag.
          type: string
        date_time_original:
          default: ""
          description: Capture time in the EXIF-provided format (local time of the
            camera).
          type: string
        exposure_time:
          default: ""
          description: |-
            Exposure time the image was captured with, as a fractional-second string,
             e.g. "1/250".
          type: string
        focal_length:
          default: ""
          description: Focal length the image was captured at, including the unit,
            e.g. "26.0 mm".
          type: string
        gps_metadata:
          anyOf:
          - $ref: '#/components/schemas/riviera_api_v2.ApiExifGpsMetadata'
          - type: "null"
          description: Location tags from the image, when the source recorded a location.
        image_height:
          default: 0
          description: Height of the image, in pixels.
          format: uint32
          maximum: 4294967295
          minimum: 0
          type: integer
        image_width:
          default: 0
          description: Width of the image, in pixels.
          format: uint32
          maximum: 4294967295
          minimum: 0
          type: integer
        iso_speed:
          default: 0
          description: ISO sensitivity the image was captured at.
          format: uint32
          maximum: 4294967295
          minimum: 0
          type: integer
        lens_model:
          default: ""
          description: Model of the lens the image was captured with, when the source
            records it.
          type: string
        megapixels:
          default: 0
          description: Total pixel count of the image, in megapixels.
          format: double
          type: number
        offset_time_original:
          default: ""
          description: Timezone offset for `ApiExifMetadata.date_time_original`, e.g.
            "+09:00".
          type: string
        orientation:
          default: 0
          description: |-
            EXIF orientation value (1-8). See the EXIF spec; 1 is the normal
             upright orientation.
          format: uint32
          maximum: 4294967295
          minimum: 0
          type: integer
      type: object
    riviera_api_v2.ApiKeyframe:
      description: A single extracted scene-change keyframe.
      properties:
        image_base64:
          default: ""
          description: |-
            The extracted frame as a base64-encoded JPEG image. Empty when the request
             set `include_images = false`.
          type: string
        scene_score:
          default: 0
          description: |-
            Scene-change score that triggered this keyframe, in the range [0.0, 1.0].
             Higher values indicate a more pronounced scene change relative to the
             preceding frame. The first keyframe of a video is always reported as 1.0:
             the start of a video is a scene boundary by definition, so that score is
             not a measured frame-to-frame comparison.
          format: double
          type: number
        timestamp:
          default: 0
          description: |-
            Presentation timestamp of the keyframe, in seconds from the start of the
             video.
          format: double
          type: number
      type: object
    riviera_api_v2.ApiMediaMetadata:
      description: |-
        Audio/video container and per-stream metadata. Fields are populated on a
         best-effort basis and may be empty when absent from the source file.
      properties:
        bitrate_bps:
          default: 0
          description: Overall bitrate of the container, in bits per second.
          format: uint64
          minimum: 0
          type: integer
        creation_time:
          default: ""
          description: Container-level creation time, when present.
          type: string
        duration_s:
          default: 0
          description: Duration of the media, in seconds.
          format: double
          type: number
        streams:
          description: The audio and video streams the container holds, in container
            order.
          items:
            $ref: '#/components/schemas/riviera_api_v2.ApiMediaStream'
          type:
          - array
          - "null"
      type: object
    riviera_api_v2.ApiMediaStream:
      description: A single audio or video stream within a media file.
      properties:
        bitrate_bps:
          default: 0
          description: Bitrate of this stream, in bits per second.
          format: uint64
          minimum: 0
          type: integer
        channel_layout:
          default: ""
          description: Layout of the audio channels, e.g. "stereo". Empty for video
            streams.
          type: string
        channels:
          default: 0
          description: Number of audio channels in the stream. Zero for video streams.
          format: uint32
          maximum: 4294967295
          minimum: 0
          type: integer
        codec_name:
          default: ""
          description: Name of the codec the stream is encoded with, e.g. "h264" or
            "aac".
          type: string
        codec_type:
          default: ""
          description: Kind of media the stream carries, e.g. "audio" or "video".
          type: string
        display_aspect_ratio:
          default: ""
          description: |-
            Aspect ratio the video should be displayed at, as a "width:height" string,
             e.g. "16:9". Empty for audio streams.
          type: string
        duration_s:
          default: 0
          description: Duration of this stream, in seconds.
          format: double
          type: number
        frames_per_second:
          default: 0
          description: Frame rate of the stream, in frames per second. Zero for audio
            streams.
          format: double
          type: number
        height:
          default: 0
          description: Height of the video frame, in pixels. Zero for audio streams.
          format: uint32
          maximum: 4294967295
          minimum: 0
          type: integer
        index:
          default: 0
          description: Zero-based index of the stream within the container.
          format: uint32
          maximum: 4294967295
          minimum: 0
          type: integer
        language_iso_639:
          default: ""
          description: ISO 639 language code for the stream, when present.
          type: string
        rotation:
          default: 0
          description: |-
            Rotation to apply on playback, in degrees, as recorded in the stream
             metadata. Zero for audio streams and for video that needs no rotation.
          format: int32
          type: integer
        sample_rate_s:
          default: 0
          description: |-
            Sample rate of the audio stream, in samples per second. Zero for video
             streams.
