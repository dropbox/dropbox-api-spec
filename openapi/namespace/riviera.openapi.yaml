    riviera_api_v2.ExtractApiV2Error.is_a_folder_error:
      description: The target is a folder, not a file.
      properties:
        .tag:
          enum:
          - is_a_folder_error
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.ExtractApiV2Error.limit_exceeded_error:
      description: |-
        A resource limit was exceeded: the source file is larger than the
         requested `extract_type` accepts, or the result would be too large to
         return. For `keyframes`, raise `scene_change_threshold` or turn off
         `include_images`; for `markdown`, turn off `embed_images`.
      properties:
        .tag:
          enum:
          - limit_exceeded_error
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.ExtractApiV2Error.link_download_disabled_error:
      description: |-
        `FileIdOrUrl.url` referenced a Dropbox shared link whose owner has
         disabled downloads.
      properties:
        .tag:
          enum:
          - link_download_disabled_error
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.ExtractApiV2Error.no_audio_error:
      description: '`transcript` only: the source file has no audio track.'
      properties:
        .tag:
          enum:
          - no_audio_error
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.ExtractApiV2Error.not_found_error:
      description: The referenced file does not exist or is not accessible.
      properties:
        .tag:
          enum:
          - not_found_error
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.ExtractApiV2Error.other:
      description: 'An open-union catch-all: a variant added to this union after your
