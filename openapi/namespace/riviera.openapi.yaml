      - $ref: '#/components/schemas/riviera_api_v2.GetMarkdownAsyncCheckResult.failed'
      - $ref: '#/components/schemas/riviera_api_v2.GetMarkdownAsyncCheckResult.other'
    riviera_api_v2.GetMarkdownAsyncCheckResult.complete:
