      - $ref: '#/components/schemas/riviera_api_v2.ExtractApiV2Error.shared_link_password_protected'
      - $ref: '#/components/schemas/riviera_api_v2.ExtractApiV2Error.limit_exceeded_error'
      - $ref: '#/components/schemas/riviera_api_v2.ExtractApiV2Error.conversion_failure_error'
      - $ref: '#/components/schemas/riviera_api_v2.ExtractApiV2Error.not_found_error'
      - $ref: '#/components/schemas/riviera_api_v2.ExtractApiV2Error.is_a_folder_error'
      - $ref: '#/components/schemas/riviera_api_v2.ExtractApiV2Error.no_audio_error'
      - $ref: '#/components/schemas/riviera_api_v2.ExtractApiV2Error.other'
    riviera_api_v2.ExtractApiV2Error.conversion_failure_error:
