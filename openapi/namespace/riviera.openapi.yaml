            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/riviera_api_v2.GetMarkdownResult'
      description: The job finished successfully.
    riviera_api_v2.GetMarkdownAsyncCheckResult.failed:
      description: The job finished unsuccessfully.
      properties:
