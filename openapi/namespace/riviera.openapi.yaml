          - shared_link_password_protected
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.TransformApiV2Error.unsupported_format_error:
      description: |-
        The source file is not in a format the requested `transform_type` can
         convert.
      properties:
        .tag:
          enum:
          - unsupported_format_error
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.TransformApiV2Error.user_error:
      description: |-
        The request could not be processed as supplied (a problem with the
         caller's input). The string is a human-readable message; retrying the
         same request will not help.
      properties:
        .tag:
          enum:
          - user_error
          type: string
        user_error:
          default: ""
          description: |-
            The request could not be processed as supplied (a problem with the
             caller's input). The string is a human-readable message; retrying the
             same request will not help.
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.TransformArgs:
      description: |-
        Arguments for the asynchronous `get_transform_async` route.

         Exactly one of `file_id`, `path`, or `url` must be supplied via
         `file_id_or_url` to identify the source file, and exactly one variant of
         `transform_type` must be set to say what to produce from it.

         At most one options message may be set, and it must be the one belonging to
         the requested `transform_type`. Options that belong to a different transform
         type are rejected with `invalid_options_error` rather than ignored, so that a
         request whose parameters were misassembled fails visibly instead of quietly
         producing the wrong output.
      examples:
      - file_id_or_url:
          .tag: path
          path: /folder/example.pdf
        image:
          page_number: 1
          scale_percent: 100
        transform_type:
          .tag: image
      - file_id_or_url:
          .tag: path
          path: /folder/example.pdf
        thumbnail:
          format:
            .tag: jpeg
          mode:
            .tag: strict
          size:
            .tag: w64h64
        transform_type:
          .tag: thumbnail
      properties:
        file_id_or_url:
          anyOf:
          - $ref: '#/components/schemas/riviera_api_v2.FileIdOrUrl'
          - type: "null"
          description: |-
            Identifier of the source file to transform. Callers must set exactly one of
             the `FileIdOrUrl` variants. The referenced file must be in a format the
             requested `transform_type` supports; see the route description for the
             per-transform format lists. Requests against unsupported formats fail with
             `unsupported_format_error`.
        image:
          anyOf:
          - $ref: '#/components/schemas/riviera_api_v2.ImageOptions'
          - type: "null"
          description: Options for `TransformType.image` and `TransformType.image_pdf`.
        thumbnail:
          anyOf:
          - $ref: '#/components/schemas/riviera_api_v2.ThumbnailOptions'
          - type: "null"
          description: Options for `TransformType.thumbnail`.
        transform_type:
          $ref: '#/components/schemas/riviera_api_v2.TransformType'
          description: What to produce from the source file. Required.
        video_frame:
          anyOf:
          - $ref: '#/components/schemas/riviera_api_v2.VideoFrameOptions'
          - type: "null"
          description: Options for `TransformType.video_frame`.
      required:
      - transform_type
      type: object
    riviera_api_v2.TransformOutput:
      description: |-
        A completed transform: a handle for retrieving the produced bytes, plus
         enough metadata to decide whether to retrieve them.

         The bytes themselves are deliberately not carried here. A completed async
         result is persisted, so it is bounded by a row-size limit well below the size
         of a typical converted document -- an inline payload would fail for exactly
         the large documents this route exists to convert. The transform therefore
         completes by caching its output and handing back `output_handle`, which
         `download_transform_output` exchanges for the bytes.
      properties:
        expires_ts:
          default: 0
          description: |-
            Unix timestamp, in seconds, after which `output_handle` is no longer
             accepted. Retrieve the bytes before this point; after it,
             `download_transform_output` reports `expired_handle_error` and the transform
             has to be requested again.
          format: uint64
          minimum: 0
          type: integer
        format:
          default: ""
          description: |-
            Format of the produced output, as a short lowercase format name such as
             "pdf", "html", "jpeg", or "png". This reflects what was actually produced,
             which for some sources differs from what was requested.
          type: string
        mime_type:
          default: ""
          description: |-
            MIME type corresponding to `format`, for callers that need a Content-Type
             to hand to a downstream consumer.
          type: string
        output_handle:
          default: ""
          description: |-
            Opaque, single-purpose handle for the produced bytes. Pass it to
             `download_transform_output` to retrieve them. The handle is scoped to the
             account that created it and cannot be used to read anything other than the
             output of this transform. It is not a URL and carries no meaning for
             callers beyond being passed back verbatim.
          type: string
        size:
          default: 0
          description: Size of the produced output in bytes.
          format: uint64
          minimum: 0
          type: integer
      type: object
    riviera_api_v2.TransformType:
      description: |-
        Which derived file to produce from the source file.

         Unlike the other Riviera content routes, which each expose one capability,
         `get_transform_async` is a single route over many conversions: the caller
         names the source file and the output it wants, and the service picks the
         conversion pipeline. Exactly one variant must be set; a request with none set
         fails with `invalid_options_error`.
      oneOf:
      - $ref: '#/components/schemas/riviera_api_v2.TransformType.pdf'
      - $ref: '#/components/schemas/riviera_api_v2.TransformType.html'
      - $ref: '#/components/schemas/riviera_api_v2.TransformType.image'
      - $ref: '#/components/schemas/riviera_api_v2.TransformType.thumbnail'
      - $ref: '#/components/schemas/riviera_api_v2.TransformType.image_pdf'
      - $ref: '#/components/schemas/riviera_api_v2.TransformType.video_frame'
    riviera_api_v2.TransformType.html:
      description: |-
        Convert the source document to HTML. Supported for spreadsheets only,
         where HTML preserves the sheet layout that a PDF rendering flattens.
      properties:
        .tag:
          enum:
          - html
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.TransformType.image:
      description: |-
        Re-encode the source as a web-safe raster image (JPEG or PNG). This is
         the transform to use to normalize formats a browser cannot display
         directly -- HEIC, camera RAW, PSD, SVG -- and to render a single page of
         a document as an image. Formats a browser can already display, such as
         JPEG and PNG, are not accepted; use `thumbnail` to resize or re-encode
         those. Configured by `TransformArgs.image`.
      properties:
        .tag:
          enum:
          - image
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.TransformType.image_pdf:
      description: |-
        Render the source as a page image by way of a PDF conversion, rather
         than by whichever image pipeline the source format would otherwise use.
         Prefer `image` unless you specifically need the PDF-rendered result; the
         two differ for formats that have a native image pipeline of their own
         (ebooks, for example). Configured by `TransformArgs.image`.
      properties:
        .tag:
          enum:
          - image_pdf
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.TransformType.pdf:
      description: |-
        Convert the source document to PDF. Supported for word-processing,
         presentation, and spreadsheet documents; images are not accepted.
      properties:
        .tag:
          enum:
          - pdf
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.TransformType.thumbnail:
      description: |-
        Produce a resized thumbnail of the source at one of the supported sizes.
         Configured by `TransformArgs.thumbnail`.
      properties:
        .tag:
          enum:
          - thumbnail
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.TransformType.video_frame:
      description: |-
        Extract a single frame from a video as a still image. Configured by
         `TransformArgs.video_frame`.

         This produces one frame at one requested offset. To get the set of
         scene-change keyframes across a whole video, use `get_keyframes_async`,
         which returns every detected frame with its timestamp and scene score.
      properties:
        .tag:
          enum:
          - video_frame
          type: string
      required:
      - .tag
      type: object
    riviera_api_v2.VideoFrameOptions:
      description: |-
        Options for `TransformType.video_frame`. Supplying this message with any
         other transform type fails with `invalid_options_error`.
      examples:
      - offset_in_seconds: 12.5
        scale_percent: 100
      properties:
        offset_in_seconds:
          default: 0
          description: |-
            Offset into the video, in seconds, of the frame to extract. Should be
             within the video's duration. Defaults to 0 (the first frame) when omitted.

             Only the lower bound is enforced, because the upper bound is the source's
             duration, which is not known until the video is opened. An offset past the
             end is not rejected.
          format: double
          minimum: 0
          type: number
        scale_percent:
          default: 100
          description: |-
            Scale the extracted frame to this percentage of the video's natural frame
             size. Must be in (0, 100]; the pipeline does not upscale. Defaults to 100
             (no scaling) when omitted.
          format: uint32
          maximum: 100
          minimum: 1
          type: integer
      type: object
  securitySchemes:
    dropboxAppAuth:
      description: |-
        App-level OAuth 2.0 token (no user context). Use `Authorization: Bearer <token>`.

        Obtain by calling the token endpoint with `grant_type=client_credentials`.

        Only available on endpoints that declare app auth support.
      flows:
        clientCredentials:
          scopes:
            files.content.read: 'Required Dropbox scope: files.content.read'
          tokenUrl: https://api.dropboxapi.com/oauth2/token
      type: oauth2
    dropboxOAuth2:
      description: |-
        OAuth 2.0 token issued to a specific user. Use `Authorization: Bearer <token>`.

        Public clients should use the authorization code flow with PKCE (S256).

        For background or offline access, send `token_access_type=offline` during authorization and use the returned refresh token to obtain new access tokens.

        You can generate a short-lived access token in the Developer Console; see [Testing with a generated token](https://docs.dropboxapi.com/dropbox-api/docs/oauth#testing-with-a-generated-token).
      flows:
        authorizationCode:
          authorizationUrl: https://www.dropbox.com/oauth2/authorize
          scopes:
            files.content.read: 'Required Dropbox scope: files.content.read'
          tokenUrl: https://api.dropboxapi.com/oauth2/token
      type: oauth2
      x-fern-playground-description: You can generate a short-lived access token in
        the Developer Console; see [Testing with a generated token](https://docs.dropboxapi.com/dropbox-api/docs/oauth#testing-with-a-generated-token).
externalDocs:
  description: Dropbox API HTTP Reference
  url: https://www.dropbox.com/developers/documentation/http/documentation
info:
  contact:
    name: Dropbox Developer Support
    url: https://www.dropbox.com/developers
  description: The Dropbox API allows developers to work with files in Dropbox, including
    advanced functionality like full-text search, thumbnails, and sharing.
  license:
    name: Dropbox Developer Terms
    url: https://www.dropbox.com/developers/reference/tos
  termsOfService: https://www.dropbox.com/developers/reference/tos
  title: Dropbox API
  version: 1.0.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
openapi: 3.1.0
paths:
  /2/riviera/download_transform_output:
    post:
      description: |-
        Download the output of a completed `get_transform_async` job.

         Pass the `output_handle` from the job's `complete` result. The body is the
         produced file, and the `Dropbox-API-Result` header describes it.

         A handle can only be redeemed by the user who requested the transform, and
         only until its `expires_ts`; after that this route fails with
         `expired_handle_error`, and the transform has to be requested again. A
         handle that was never valid, or that belongs to another user, fails with
         `user_error`.

        **Required scope:** `files.content.read`

        **Endpoint format:** [Content-download](https://docs.dropboxapi.com/dropbox-api/docs/technical-reference/request-response-formats#content-download-endpoints)

        **Authentication:** [App](https://docs.dropboxapi.com/dropbox-api/docs/auth-types#app-authentication), [User](https://docs.dropboxapi.com/dropbox-api/docs/auth-types#user-authentication)

        This endpoint does not support apps with the app folder permission.
      operationId: rivieraDownloadTransformOutput
      parameters:
      - $ref: '#/components/parameters/Dropbox-API-Select-User'
      - $ref: '#/components/parameters/Dropbox-API-Path-Root'
      - content:
          application/json:
            schema:
              $ref: '#/components/schemas/riviera_api_v2.DownloadTransformOutputArgs'
        description: JSON-encoded arguments. Non-ASCII characters and 0x7F must use
          JSON \uXXXX escape sequences to be HTTP-header-safe.
        in: header
        name: Dropbox-API-Arg
        required: true
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: Successful response
          headers:
            Dropbox-API-Result:
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/riviera_api_v2.DownloadTransformOutputResult'
              description: JSON-encoded result metadata.
              required: true
            X-Dropbox-Request-Id:
              $ref: '#/components/headers/X-Dropbox-Request-Id'
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "409":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: '#/components/schemas/riviera_api_v2.TransformApiV2Error'
                  error_summary:
                    description: A human-readable summary of the error.
                    type: string
                  user_message:
                    properties:
                      locale:
                        type: string
                      text:
                        type: string
                    type: object
                required:
                - error_summary
                - error
                type: object
          description: Endpoint-specific error
          headers:
            X-Dropbox-Request-Id:
              $ref: '#/components/headers/X-Dropbox-Request-Id'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
      security:
      - dropboxAppAuth:
        - files.content.read
      - dropboxOAuth2:
        - files.content.read
      servers:
      - url: https://content.dropboxapi.com
      summary: Download Transform Output
      tags:
      - riviera
      x-auth-type: app,user
      x-fern-availability: preview
  /2/riviera/extract_async:
    post:
      description: |-
        Asynchronous content extraction from a single file.

         One route covers every Riviera extraction. Name the source file in
         `file_id_or_url`, and say what to extract in `extract_type`, whose variant
         carries that extraction's options:

           - `markdown`: a document, converted to markdown that preserves its
             structure.
           - `text`: the plain text of a document.
           - `ocr`: the text of an image or scanned PDF, plus hOCR with per-word
             coordinates.
           - `transcript`: the timestamped transcript of an audio or video file.
           - `keyframes`: one keyframe per scene change in a video.

         The accepted formats and size limits differ per extraction; see
         `ExtractType`. Formats the requested extraction does not support fail with
         `unsupported_format_error`, and files over its size limit fail with
         `limit_exceeded_error`.

         The result is not returned by this route. Poll `extract_async/check` with
         the returned async job ID until it reports `complete` or `failed`. A
         `complete` result is an `ExtractResult` whose variant matches the requested
         `extract_type`.

        **Required scope:** `files.content.read`

        **Endpoint format:** [RPC](https://docs.dropboxapi.com/dropbox-api/docs/technical-reference/request-response-formats#rpc-endpoints)

        **Authentication:** [App](https://docs.dropboxapi.com/dropbox-api/docs/auth-types#app-authentication), [User](https://docs.dropboxapi.com/dropbox-api/docs/auth-types#user-authentication)

        This endpoint does not support apps with the app folder permission.
      operationId: rivieraExtractAsync
      parameters:
      - $ref: '#/components/parameters/Dropbox-API-Select-User'
      - $ref: '#/components/parameters/Dropbox-API-Path-Root'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/riviera_api_v2.ExtractArgs'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/async_common.LaunchResultBase'
          description: Successful response
          headers:
            X-Dropbox-Request-Id:
              $ref: '#/components/headers/X-Dropbox-Request-Id'
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
      security:
      - dropboxAppAuth:
        - files.content.read
      - dropboxOAuth2:
        - files.content.read
      summary: Extract Async
      tags:
      - riviera
      x-auth-type: app,user
      x-fern-availability: preview
  /2/riviera/extract_async/check:
    post:
      description: |-
        Returns the status or result of specified extract_async task.

        **Required scope:** `files.content.read`

        **Endpoint format:** [RPC](https://docs.dropboxapi.com/dropbox-api/docs/technical-reference/request-response-formats#rpc-endpoints)

        **Authentication:** [App](https://docs.dropboxapi.com/dropbox-api/docs/auth-types#app-authentication), [User](https://docs.dropboxapi.com/dropbox-api/docs/auth-types#user-authentication)

        This endpoint does not support apps with the app folder permission.
      operationId: rivieraExtractAsyncCheck
      parameters:
      - $ref: '#/components/parameters/Dropbox-API-Select-User'
      - $ref: '#/components/parameters/Dropbox-API-Path-Root'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/async_common.PollArg'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/riviera_api_v2.ExtractAsyncCheckResult'
          description: Successful response
          headers:
            X-Dropbox-Request-Id:
              $ref: '#/components/headers/X-Dropbox-Request-Id'
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "409":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: '#/components/schemas/async_common.PollError'
                  error_summary:
                    description: A human-readable summary of the error.
                    type: string
                  user_message:
                    properties:
                      locale:
                        type: string
                      text:
                        type: string
                    type: object
                required:
                - error_summary
                - error
                type: object
          description: Endpoint-specific error
          headers:
            X-Dropbox-Request-Id:
              $ref: '#/components/headers/X-Dropbox-Request-Id'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
      security:
      - dropboxAppAuth:
        - files.content.read
      - dropboxOAuth2:
        - files.content.read
      summary: Check status of ExtractAsync
      tags:
      - riviera
      x-auth-type: app,user
      x-fern-availability: preview
  /2/riviera/get_keyframes_async:
    post:
      deprecated: true
      description: |-
        Deprecated: use [extract_async](api:riviera:POST/2/riviera/extract_async) with `extract_type` set to
         `ExtractType.keyframes` instead, which takes the same options. This
         route will be turned off by December 31, 2026.

         Asynchronous scene-change keyframe extraction for video files.

         Detects scene changes in the source video and returns one representative
         keyframe per detected scene, each tagged with its timestamp (seconds from
         the start of the video) and scene-change score. Set `include_images = true`
         to also receive each frame as a base64-encoded JPEG; when the field is
         omitted the response carries keyframe metadata only.

         Supported video formats: .3gp, .3gpp, .3gpp2, .asf, .avi, .dv, .flv, .m2t,
         .m2ts, .m4v, .mkv, .mov, .mp4, .mpeg, .mpg, .mts, .mxf, .oggtheora, .ogv,
         .rm, .ts, .vob, .webm, .wmv. Unsupported formats return an
         `unsupported_format_error`.

         Limits: the source file must be at most 10 GB. To keep responses within
         service limits the number of keyframes and the total image payload are
         bounded; requests that would exceed these limits return a
         `limit_exceeded_error` -- raise `scene_change_threshold` or set
         `include_images = false` to stay within bounds.

        **Required scope:** `files.content.read`

        **Endpoint format:** [RPC](https://docs.dropboxapi.com/dropbox-api/docs/technical-reference/request-response-formats#rpc-endpoints)

        **Authentication:** [App](https://docs.dropboxapi.com/dropbox-api/docs/auth-types#app-authentication), [User](https://docs.dropboxapi.com/dropbox-api/docs/auth-types#user-authentication)

        This endpoint does not support apps with the app folder permission.
      operationId: rivieraDeprecatedGetKeyframesAsync
      parameters:
      - $ref: '#/components/parameters/Dropbox-API-Select-User'
      - $ref: '#/components/parameters/Dropbox-API-Path-Root'
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/riviera_api_v2.GetKeyframesArgs'
              - type: "null"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/async_common.LaunchResultBase'
          description: Successful response
          headers:
            X-Dropbox-Request-Id:
              $ref: '#/components/headers/X-Dropbox-Request-Id'
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
      security:
      - dropboxAppAuth:
        - files.content.read
      - dropboxOAuth2:
        - files.content.read
      summary: Get Keyframes Async
      tags:
      - rivieraDeprecated
      x-auth-type: app,user
      x-fern-availability: preview
  /2/riviera/get_keyframes_async/check:
    post:
      deprecated: true
      description: |-
        Returns the status or result of specified get_keyframes_async task.

        **Required scope:** `files.content.read`

        **Endpoint format:** [RPC](https://docs.dropboxapi.com/dropbox-api/docs/technical-reference/request-response-formats#rpc-endpoints)

        **Authentication:** [App](https://docs.dropboxapi.com/dropbox-api/docs/auth-types#app-authentication), [User](https://docs.dropboxapi.com/dropbox-api/docs/auth-types#user-authentication)

        This endpoint does not support apps with the app folder permission.
      operationId: rivieraDeprecatedGetKeyframesAsyncCheck
      parameters:
      - $ref: '#/components/parameters/Dropbox-API-Select-User'
      - $ref: '#/components/parameters/Dropbox-API-Path-Root'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/async_common.PollArg'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/riviera_api_v2.GetKeyframesAsyncCheckResult'
          description: Successful response
          headers:
            X-Dropbox-Request-Id:
              $ref: '#/components/headers/X-Dropbox-Request-Id'
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "409":
          content:
            application/json:
              schema:
                properties:
                  error:
                    $ref: '#/components/schemas/async_common.PollError'
                  error_summary:
                    description: A human-readable summary of the error.
                    type: string
                  user_message:
                    properties:
                      locale:
                        type: string
                      text:
                        type: string
                    type: object
                required:
                - error_summary
                - error
                type: object
          description: Endpoint-specific error
          headers:
            X-Dropbox-Request-Id:
              $ref: '#/components/headers/X-Dropbox-Request-Id'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
      security:
      - dropboxAppAuth:
        - files.content.read
      - dropboxOAuth2:
        - files.content.read
      summary: Check status of GetKeyframesAsync
      tags:
      - rivieraDeprecated
      x-auth-type: app,user
      x-fern-availability: preview
  /2/riviera/get_markdown_async:
