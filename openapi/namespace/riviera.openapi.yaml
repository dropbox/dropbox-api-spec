          default: ""
          description: Company recorded in the document properties.
          type: string
        creator:
          default: ""
          description: Author recorded in the document properties.
          type: string
        description:
          default: ""
          description: Description recorded in the document properties.
          type: string
        file_type:
          $ref: '#/components/schemas/riviera_api_v2.OfficeFileType'
          description: Which kind of Office document this metadata was extracted from.
        keywords:
          default: ""
          description: |-
            Keywords recorded in the document properties, in the document's own
             formatting (typically a single comma- or space-separated string).
          type: string
        pages:
          default: 0
          description: |-
            Page count recorded in the document properties. Word documents only; zero
             for PowerPoint and Excel.
          format: uint32
          maximum: 4294967295
          minimum: 0
          type: integer
        revision_number:
          default: ""
          description: Revision number recorded in the document properties.
          type: string
        slides:
          default: 0
          description: |-
            Slide count recorded in the document properties. PowerPoint documents only;
             zero for Word and Excel.
          format: uint32
          maximum: 4294967295
          minimum: 0
          type: integer
        subject:
          default: ""
          description: Subject recorded in the document properties.
          type: string
        title:
          default: ""
          description: Title recorded in the document properties.
          type: string
        total_edit_time_minutes:
          default: 0
          description: Total editing time recorded in the document properties, in
            minutes.
          format: uint32
          maximum: 4294967295
          minimum: 0
          type: integer
        words:
          default: 0
          description: |-
            Word count recorded in the document properties. Word documents only; zero
             for PowerPoint and Excel.
          format: uint32
          maximum: 4294967295
          minimum: 0
          type: integer
      type: object
    riviera_api_v2.ApiPdfMetadata:
      description: PDF document metadata.
      properties:
        height:
          default: 0
          description: Height of the first page, in PDF points.
          format: uint32
          maximum: 4294967295
          minimum: 0
          type: integer
        pages:
          default: 0
          description: Number of pages in the document.
          format: uint32
          maximum: 4294967295
          minimum: 0
          type: integer
        width:
          default: 0
          description: Width of the first page, in PDF points.
          format: uint32
          maximum: 4294967295
          minimum: 0
          type: integer
      type: object
    riviera_api_v2.ApiStructuredTranscript:
      description: A transcript, split into segments.
      properties:
        segments:
          description: The segments of the transcript, in playback order.
          items:
            $ref: '#/components/schemas/riviera_api_v2.ApiTranscriptSegment'
          type:
          - array
          - "null"
        transcript_locale:
          default: ""
          description: |-
            The language of the transcript, as an ISO 639-1 code (e.g. "en"). This is
             the language detected in the audio, or the one supplied in
             `GetTranscriptArgs.audio_language`.
          type: string
      type: object
    riviera_api_v2.ApiTranscriptSegment:
      description: |-
        A contiguous span of transcribed speech. The span covered by a segment
         depends on the requested `TimestampLevel`.
      properties:
        end_time:
          default: 0
          description: |-
            Offset of the end of this segment, in seconds from the beginning of the
             media.
          format: double
          type: number
        start_time:
          default: 0
          description: |-
            Offset of the start of this segment, in seconds from the beginning of the
             media.
          format: double
          type: number
        text:
          default: ""
          description: The transcribed text of this segment.
          type: string
      type: object
    riviera_api_v2.ContentApiV2Error:
      description: |-
