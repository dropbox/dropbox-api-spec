  /2/team/members/remove:
    post:
      description: |-
        Removes a member from a team.

         Permission : Team member management

         Exactly one of team_member_id, email, or external_id must be provided to identify the user account.

         Accounts can be recovered via [members/recover](api:dropbox-api:POST/2/team/members/recover) for a 7 day period
         or until the account has been permanently deleted or transferred to another account
         (whichever comes first). Calling [members/add](api:dropbox-api:POST/2/team/members/add) while a user is still recoverable
         on your team will return with `MemberAddResult.user_already_on_team`.

         Accounts can have their files transferred via the admin console for a limited time, based on the version history
         length associated with the team (180 days for most teams).

         Accounts can have their stacks transferred through the admin console. This only transfers stacks that they have created.

         This endpoint may initiate an asynchronous job. To obtain the final result
         of the job, the client should periodically poll [members/remove/job_status/get](api:dropbox-api:POST/2/team/members/remove/job_status/get).

        **Required scope:** `members.delete`

        **Endpoint format:** [RPC](https://docs.dropboxapi.com/dropbox-api/docs/technical-reference/request-response-formats#rpc-endpoints)

        **Authentication:** [Team](https://docs.dropboxapi.com/dropbox-api/docs/auth-types#team-authentication)
