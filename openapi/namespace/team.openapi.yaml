    async_common.LaunchEmptyResult.complete:
      description: The job finished synchronously and successfully.
      properties:
        .tag:
          enum:
          - complete
          type: string
      required:
      - .tag
      type: object
    async_common.LaunchResultBase:
      description: |-
        Result returned by methods that launch an asynchronous job.

          A method who may either launch an asynchronous job, or complete the request
          synchronously, can use this union by extending it, and adding a 'complete' field
          with the type of the synchronous response.

          See `LaunchEmptyResult` for an example.
      examples:
      - .tag: async_job_id
        async_job_id: 34g93hh34h04y384084
      oneOf:
      - $ref: '#/components/schemas/async_common.LaunchResultBase.async_job_id'
      x-stone-union-closed: true
    async_common.LaunchResultBase.async_job_id:
      description: |-
        This response indicates that the processing is asynchronous.
         The string is an id that can be used to obtain the status of the asynchronous job.
      properties:
        .tag:
          enum:
          - async_job_id
          type: string
        async_job_id:
          anyOf:
          - $ref: '#/components/schemas/async_common.AsyncJobId'
          - type: "null"
      required:
      - .tag
      - async_job_id
      type: object
    async_common.PollArg:
      description: Arguments for methods that poll the status of an asynchronous job.
      examples:
      - async_job_id: 34g93hh34h04y384084
      properties:
        async_job_id:
          $ref: '#/components/schemas/async_common.AsyncJobId'
          description: |-
            Id of the asynchronous job.
             This is the value of a response returned from the method that launched the job.
      required:
      - async_job_id
      type: object
    async_common.PollEmptyResult:
      description: |-
        Result returned by methods that poll for the status of an asynchronous job.
         Upon completion of the job, no additional information is returned.
      examples:
      - .tag: complete
        complete: null
      - .tag: in_progress
        in_progress: null
      oneOf:
      - $ref: '#/components/schemas/async_common.PollEmptyResult.in_progress'
      - $ref: '#/components/schemas/async_common.PollEmptyResult.complete'
      x-stone-union-closed: true
    async_common.PollEmptyResult.complete:
      description: The asynchronous job has completed successfully.
      properties:
        .tag:
          enum:
          - complete
          type: string
      required:
      - .tag
      type: object
    async_common.PollEmptyResult.in_progress:
      description: The asynchronous job is still in progress.
      properties:
        .tag:
          enum:
          - in_progress
          type: string
      required:
      - .tag
      type: object
    async_common.PollError:
      description: Error returned by methods for polling the status of asynchronous
