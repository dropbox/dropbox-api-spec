            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: Array of the number of shared folders with some activity
              in the last day.
          active_shared_folders_28_day:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: Array of the number of shared folders with some activity
              in the last 28 days.
          active_shared_folders_7_day:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: Array of the number of shared folders with some activity
              in the last week.
          active_users_1_day:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: Array of the number of users who have been active in the
              last day.
          active_users_28_day:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: Array of the number of users who have been active in the
              last 28 days.
          active_users_7_day:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: Array of the number of users who have been active in the
              last week.
          adds:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: Array of total number of adds by team members.
          deletes:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: Array of total number of deletes by team members.
          edits:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: |-
              Array of number of edits by team members.
               If the same user edits the same file multiple times this is counted as a single edit.
          shared_links_created:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: Array of the number of shared links created.
          shared_links_viewed_by_not_logged_in:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: Array of the number of views by non-logged-in users to shared
              links created by the team.
          shared_links_viewed_by_outside_user:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: Array of the number of views by users outside of the team
              to shared links created by the team.
          shared_links_viewed_by_team:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: Array of the number of views by team users to shared links
              created by the team.
          shared_links_viewed_total:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: Array of the total number of views to shared links created
              by the team.
        required:
        - active_shared_folders_1_day
        - active_shared_folders_28_day
        - active_shared_folders_7_day
        - active_users_1_day
        - active_users_28_day
        - active_users_7_day
        - adds
        - deletes
        - edits
        - shared_links_created
        - shared_links_viewed_by_not_logged_in
        - shared_links_viewed_by_outside_user
        - shared_links_viewed_by_team
        - shared_links_viewed_total
        type: object
      description: |-
        Activity Report Result.
         Each of the items in the storage report is an array of values, one value per day.
         If there is no data for a day, then the value will be None.
    team_reports_apiv2.GetDevicesReport:
      allOf:
      - $ref: '#/components/schemas/team_reports_apiv2.BaseDfbReport'
      - properties:
          active_1_day:
            $ref: '#/components/schemas/team_reports_apiv2.DevicesActive'
            description: Report of the number of devices active in the last day.
          active_28_day:
            $ref: '#/components/schemas/team_reports_apiv2.DevicesActive'
            description: Report of the number of devices active in the last 28 days.
          active_7_day:
            $ref: '#/components/schemas/team_reports_apiv2.DevicesActive'
            description: Report of the number of devices active in the last 7 days.
        required:
        - active_1_day
        - active_28_day
        - active_7_day
        type: object
      description: |-
        Devices Report Result. Contains subsections for different time ranges of activity.
         Each of the items in each subsection of the storage report is an array of values,
         one value per day.
         If there is no data for a day, then the value will be None.
    team_reports_apiv2.GetMembershipReport:
      allOf:
      - $ref: '#/components/schemas/team_reports_apiv2.BaseDfbReport'
      - properties:
          licenses:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: The total number of licenses the team has, for each day.
          members_joined:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: The number of members that joined the team, for each day.
          pending_invites:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: The number of pending invites to the team, for each day.
          suspended_members:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: The number of suspended team members, for each day.
          team_size:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: Team size, for each day.
        required:
        - licenses
        - members_joined
        - pending_invites
        - suspended_members
        - team_size
        type: object
      description: |-
        Membership Report Result.
         Each of the items in the storage report is an array of values, one value per day.
         If there is no data for a day, then the value will be None.
    team_reports_apiv2.GetStorageReport:
      allOf:
      - $ref: '#/components/schemas/team_reports_apiv2.BaseDfbReport'
      - properties:
          member_storage_map:
            description: |-
              Array of storage summaries of team members' account sizes.
               Each storage summary is an array of key, value pairs, where each pair describes
               a storage bucket.
               The key indicates the upper bound of the bucket and the value is the
               number of users in that bucket. There is one such summary per day.
               If there is no data for a day, the storage summary will be empty.
            items:
              $ref: '#/components/schemas/team_reports_apiv2.StorageBucketList'
            type: array
          shared_folders:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: Array of the number of shared folders owned by team members,
              for each day.
          shared_usage:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: Array of the combined size (bytes) of team members' shared
              folders, for each day.
          total_usage:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: Sum of the shared, unshared, and datastore usages, for each
              day.
          unshared_usage:
            $ref: '#/components/schemas/team_reports_apiv2.NumberPerDay'
            description: Array of the combined size (bytes) of team members' root
              namespaces, for each day.
        required:
        - member_storage_map
        - shared_folders
        - shared_usage
        - total_usage
        - unshared_usage
        type: object
      description: |-
        Storage Report Result.
         Each of the items in the storage report is an array of values, one value per day.
         If there is no data for a day, then the value will be None.
    team_reports_apiv2.NumberPerDay:
      description: alias NumberPerDay = List(UInt64?)
      items:
        format: uint64
        minimum: 0
        type:
        - integer
        - "null"
      type: array
    team_reports_apiv2.StorageBucket:
      description: Describes the number of users in a specific storage bucket.
      examples:
      - bucket: 1G
        users: 21
      properties:
        bucket:
          description: |-
            The name of the storage bucket.
             For example, '1G' is a bucket of users with storage size up to 1 Giga.
          type: string
        users:
          description: The number of people whose storage is in the range of this
            storage bucket.
          format: uint64
          minimum: 0
          type: integer
      required:
      - bucket
      - users
      type: object
    team_reports_apiv2.StorageBucketList:
      description: Wrapper for List(StorageBucket) to support nested lists
      items:
        $ref: '#/components/schemas/team_reports_apiv2.StorageBucket'
      type: array
    users.Name:
      description: Representations for a person's name to assist with internationalization.
      examples:
      - abbreviated_name: FF
        display_name: Franz Ferdinand (Personal)
        familiar_name: Franz
        given_name: Franz
        surname: Ferdinand
      - abbreviated_name: ZD
        display_name: Zexy Desperado (Personal)
        familiar_name: Zexy
        given_name: Zexy Desperado
        surname: Desperado
      properties:
        abbreviated_name:
          description: An abbreviated form of the person's name. Their initials in
            most locales.
          type: string
        display_name:
          description: |-
            A name that can be used directly to represent the name of a user's
             Dropbox account.
          type: string
        familiar_name:
          description: |-
            Locale-dependent name. In the US, a person's familiar name is their
             `given_name`, but elsewhere, it could be any combination of a
             person's `given_name` and `surname`.
          type: string
        given_name:
          description: Also known as a first name.
          type: string
        surname:
          description: Also known as a last name or family name.
          type: string
      required:
      - abbreviated_name
      - display_name
      - familiar_name
      - given_name
      - surname
      type: object
    users_common.AccountId:
      maxLength: 40
      minLength: 40
      type: string
  securitySchemes:
    dropboxTeamAuth:
      description: |-
        Team-level OAuth 2.0 token issued to a Dropbox Business admin. Use `Authorization: Bearer <token>`.

        Obtain via the authorization code flow with team-scoped permissions.

        Grants access to team-wide administrative operations.

        You can generate a short-lived access token in the Developer Console; see [Testing with a generated token](https://docs.dropboxapi.com/dropbox-api/docs/oauth#testing-with-a-generated-token).
      flows:
        authorizationCode:
          authorizationUrl: https://www.dropbox.com/oauth2/authorize
          scopes:
            files.team_metadata.write: 'Required Dropbox scope: files.team_metadata.write'
            groups.read: 'Required Dropbox scope: groups.read'
            groups.write: 'Required Dropbox scope: groups.write'
            members.delete: 'Required Dropbox scope: members.delete'
            members.read: 'Required Dropbox scope: members.read'
            members.write: 'Required Dropbox scope: members.write'
            sessions.list: 'Required Dropbox scope: sessions.list'
            sessions.modify: 'Required Dropbox scope: sessions.modify'
            team_data.content.read: 'Required Dropbox scope: team_data.content.read'
            team_data.content.write: 'Required Dropbox scope: team_data.content.write'
            team_data.governance.write: 'Required Dropbox scope: team_data.governance.write'
            team_data.member: 'Required Dropbox scope: team_data.member'
            team_info.read: 'Required Dropbox scope: team_info.read'
            team_info.write: 'Required Dropbox scope: team_info.write'
          tokenUrl: https://api.dropboxapi.com/oauth2/token
      type: oauth2
      x-fern-playground-description: You can generate a short-lived access token in
        the Developer Console; see [Testing with a generated token](https://docs.dropboxapi.com/dropbox-api/docs/oauth#testing-with-a-generated-token).
