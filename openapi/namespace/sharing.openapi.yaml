  securitySchemes:
    dropboxAppAuth:
      description: |-
        App-level OAuth 2.0 token (no user context). Use `Authorization: Bearer <token>`.

        Obtain by calling the token endpoint with `grant_type=client_credentials`.

        Only available on endpoints that declare app auth support.
      flows:
        clientCredentials:
          scopes:
            sharing.read: 'Required Dropbox scope: sharing.read'
          tokenUrl: https://api.dropboxapi.com/oauth2/token
      type: oauth2
    dropboxOAuth2:
      description: |-
        OAuth 2.0 token issued to a specific user. Use `Authorization: Bearer <token>`.

        Public clients should use the authorization code flow with PKCE (S256).

        For background or offline access, send `token_access_type=offline` during authorization and use the returned refresh token to obtain new access tokens.

        You can generate a short-lived access token in the Developer Console; see [Testing with a generated token](https://docs.dropboxapi.com/dropbox-api/docs/oauth#testing-with-a-generated-token).
