      required:
      - .tag
      - set_password
      type: object
    sharing_apiv2.LinkPermission:
      description: Permissions for actions that can be performed on a link.
      examples:
      - action:
          .tag: change_audience
        allow: true
      properties:
        action:
          $ref: '#/components/schemas/sharing_apiv2.LinkAction'
        allow:
          type: boolean
        reason:
          anyOf:
          - $ref: '#/components/schemas/sharing_apiv2.PermissionDeniedReason'
          - type: "null"
      required:
      - action
      - allow
      type: object
    sharing_apiv2.LinkPermissions:
      examples:
      - allow_comments: true
        allow_download: true
        audience_options:
        - allowed: true
          audience:
            .tag: public
        - allowed: false
          audience:
            .tag: team
        - allowed: true
          audience:
            .tag: no_one
        can_allow_download: true
        can_disallow_download: false
        can_remove_expiry: false
        can_remove_password: true
        can_revoke: false
        can_set_expiry: false
        can_set_password: true
        can_use_extended_sharing_controls: false
        require_password: false
        resolved_visibility:
          .tag: public
        revoke_failure_reason:
          .tag: owner_only
        team_restricts_comments: true
        visibility_policies:
        - allowed: true
          policy:
            .tag: public
          resolved_policy:
            .tag: public
        - allowed: true
          policy:
            .tag: password
          resolved_policy:
            .tag: password
      properties:
        allow_comments:
          deprecated: true
          description: Whether comments are enabled for the linked file. This takes
            the team commenting policy into account.
          type: boolean
        allow_download:
          description: Whether the link can be downloaded or not.
          type: boolean
        audience_options:
          description: A list of link audience options the user might be able to set
            as the new audience.
          items:
            $ref: '#/components/schemas/sharing_apiv2.LinkAudienceOption'
          type:
          - array
          - "null"
        can_allow_download:
          description: |-
            Whether the user can allow downloads via the link. This refers to the ability to remove a
             no-download restriction on the link.
          type: boolean
        can_disallow_download:
          description: |-
            Whether the user can disallow downloads via the link. This refers to the ability to impose
             a no-download restriction on the link.
          type: boolean
        can_remove_expiry:
          description: Whether the user can remove the expiry of the link.
          type: boolean
        can_remove_password:
          description: Whether the user can remove the password of the link.
          type:
          - boolean
          - "null"
        can_request_access:
          description: Whether the user can request access to the content.
          type:
          - boolean
          - "null"
        can_revoke:
          description: Whether the caller can revoke the shared link.
          type: boolean
        can_set_expiry:
          description: |-
            Whether the user can set the expiry settings of the link. This refers to the ability to
             create a new expiry and modify an existing expiry.
          type: boolean
        can_set_password:
          description: Whether the user can set a password for the link.
          type:
          - boolean
          - "null"
        can_sync:
          description: Whether a user can save the content to their Dropbox account.
          type:
          - boolean
          - "null"
        can_use_extended_sharing_controls:
          description: Whether the user can use extended sharing controls, based on
            their account type.
          type:
          - boolean
          - "null"
        change_shared_link_expiration_policy:
          anyOf:
          - $ref: '#/components/schemas/sharing_apiv2.ChangeLinkExpirationPolicy'
          - type: "null"
          description: |-
            When owning team's policy `change_shared_link_expiration_policy` is `ChangeLinkExpirationPolicy.not_allowed`,
             the updated externally available shared link expiration value cannot be less strict
             than `days_to_expire_policy`.
             In this case `days_to_expire_policy` is expected to be different from `none`.
             Not provided if the link is not team owned.
        days_to_expire_policy:
          anyOf:
          - $ref: '#/components/schemas/team_policies.DefaultLinkExpirationDaysPolicy'
          - type: "null"
          description: |-
            Existing owning team's policy for default number of days from today to link's expiration.
             Not provided if the link is not team owned.
        effective_audience:
          anyOf:
          - $ref: '#/components/schemas/sharing_apiv2.LinkAudience'
          - type: "null"
          description: |-
            The type of audience who can benefit from the access level specified by the
             `link_access_level` field.
        enforce_shared_link_password_policy:
          anyOf:
          - $ref: '#/components/schemas/team_policies.EnforceLinkPasswordPolicy'
          - type: "null"
          description: |-
            Whether the updated externally available shared link must have password set.
             Not provided if the link is not team owned.
        link_access_level:
          anyOf:
          - $ref: '#/components/schemas/sharing_apiv2.LinkAccessLevel'
          - type: "null"
          description: |-
            The access level that the link will grant to its users. A link can grant additional rights
             to a user beyond their current access level. For example, if a user was invited as a viewer
             to a file, and then opens a link with `link_access_level` set to `editor`, then they will
             gain editor privileges. The `link_access_level` is a property of the link, and does not
             depend on who is calling this API. In particular, `link_access_level` does not take into
             account the API caller's current permissions to the content.
        requested_visibility:
          anyOf:
          - $ref: '#/components/schemas/sharing_apiv2.RequestedVisibility'
          - type: "null"
          description: |-
            The shared link's requested visibility. This can be overridden by the team and shared
             folder policies. The final visibility, after considering these policies, can be found in
             `resolved_visibility`. This is shown only if the caller is the link's
             owner and resolved_visibility is returned instead of effective_audience.
        require_password:
          description: Whether the user is required to provide a password to view
            the link.
          type:
          - boolean
          - "null"
        resolved_visibility:
          anyOf:
          - $ref: '#/components/schemas/sharing_apiv2.ResolvedVisibility'
          - type: "null"
          description: |-
            The current visibility of the link after considering the shared links policies of the
             the team (in case the link's owner is part of a team) and the shared folder (in case the
             linked file is part of a shared folder). This field is shown only if the caller has access
             to this info (the link's owner always has access to this data). For some links, an
             effective_audience value is returned instead.
        revoke_failure_reason:
          anyOf:
          - $ref: '#/components/schemas/sharing_apiv2.SharedLinkAccessFailureReason'
          - type: "null"
          description: |-
            The failure reason for revoking the link. This field will only be present if the
             `can_revoke` is `false`.
        team_restricts_comments:
          deprecated: true
          description: Whether the team has disabled commenting globally.
          type: boolean
        visibility_policies:
          description: A list of policies that the user might be able to set for the
            visibility.
          items:
            $ref: '#/components/schemas/sharing_apiv2.VisibilityPolicy'
          type: array
      required:
      - allow_comments
      - allow_download
      - can_allow_download
      - can_disallow_download
      - can_remove_expiry
      - can_revoke
      - can_set_expiry
      - team_restricts_comments
      - visibility_policies
      type: object
