      allOf:
      - properties:
          .tag:
            enum:
            - team
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/common.TeamRootInfo'
    common.RootInfo.user:
      allOf:
      - properties:
          .tag:
            enum:
            - user
            type: string
        required:
        - .tag
        type: object
      - $ref: '#/components/schemas/common.UserRootInfo'
    common.RootInfoBase:
      description: Information about current user's root.
      properties:
        home_namespace_id:
          $ref: '#/components/schemas/common.NamespaceId'
          description: The namespace ID for user's home namespace.
        root_namespace_id:
          $ref: '#/components/schemas/common.NamespaceId'
          description: |-
            The namespace ID for user's root namespace. It will be the namespace ID
             of the shared team root if the user is member of a team with a separate team root,
             or the user root if user is member of a team with separate distinct roots for users.
             Otherwise it will be the same as `RootInfo.home_namespace_id`.
      required:
      - home_namespace_id
      - root_namespace_id
      type: object
    common.TeamRootInfo:
      allOf:
      - $ref: '#/components/schemas/common.RootInfoBase'
      - properties:
          home_path:
            description: The path for user's home directory under the shared team
              root.
            type: string
        required:
        - home_path
        type: object
      description: Root info when user is member of a team with a separate root namespace
        ID.
    common.UserRootInfo:
      allOf:
      - $ref: '#/components/schemas/common.RootInfoBase'
      - properties:
          home_path:
            description: The path for user's home directory under the distinct user
              root.
            type:
            - string
            - "null"
        type: object
      description: |-
        Root info when user is not member of a team or
         the user is a member of a team and the team does not have a separate root namespace.
      examples:
      - home_namespace_id: "3235641"
        root_namespace_id: "3235641"
    team_common.MemberSpaceLimitType:
