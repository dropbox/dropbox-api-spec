    common.NamespaceId:
      pattern: '[-_0-9a-zA-Z:]+'
      type: string
    common.RootInfo:
      examples:
      - .tag: user
        home_namespace_id: "3235641"
        root_namespace_id: "3235641"
      oneOf:
      - $ref: '#/components/schemas/common.RootInfo.team'
      - $ref: '#/components/schemas/common.RootInfo.user'
      - $ref: '#/components/schemas/common.RootInfo.other'
    common.RootInfo.other:
