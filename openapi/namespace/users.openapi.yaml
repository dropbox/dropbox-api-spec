              - team
              - user
            type: string
        required:
        - .tag
        type: object
      description: 'An open-union catch-all: a subtype added to this union after your
        API client''s spec was generated. It carries the base type''s shared fields,
        and its ".tag" is a value not listed among the known variants above; treat
        it as an unrecognized/forward-compatible case.'
