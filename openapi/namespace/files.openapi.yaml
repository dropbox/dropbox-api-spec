        file_extensions:
          description: Restricts search to only the extensions specified. Only supported
            for active file search.
          items:
            type: string
          type:
          - array
          - "null"
        file_status:
          $ref: '#/components/schemas/files_v2.FileStatus'
          description: Restricts search to the given file status.
        filename_only:
          default: false
          description: Restricts search to only match on filenames.
          type: boolean
        image_content_search:
          default: false
          description: Search files based on image content. May conflict with other
            search options such as filename_only, order_by, etc
          type: boolean
        include_unmounted:
          default: false
          type: boolean
        max_results:
          default: 100
          description: The maximum number of search results to return. The default
            for this field is 100.
          format: uint64
          maximum: 1000
          minimum: 1
          type: integer
        order_by:
          $ref: '#/components/schemas/files_v2.OrderBy'
          description: Specified property of the order of search results. By default,
            results are sorted by relevance.
        path:
          default: ""
          description: Scopes the search to a path in the user's Dropbox. Searches
            the entire Dropbox if not specified
          pattern: (/(.|[\r\n])*)?|id:.*|(ns:[0-9]+(/.*)?)
          type: string
        reverse_order:
          default: false
          description: |-
            Results are sorted in descending rank order by default.
             If true, results will be sorted in ascending order.
          type: boolean
      type: object
    files_v2.SearchV2Arg:
      properties:
        api_app:
          anyOf:
          - $ref: '#/components/schemas/files_v2.ApiApp'
          - type: "null"
        include_highlights:
          default: false
          type: boolean
        match_field_options:
          anyOf:
          - $ref: '#/components/schemas/files_v2.SearchMatchFieldOptions'
          - type: "null"
        options:
          anyOf:
          - $ref: '#/components/schemas/files_v2.SearchOptions'
          - type: "null"
          description: Options for more targeted search results.
        query:
          description: The string to search for.
          maxLength: 1000
          type: string
        session_id:
          default: ""
          description: The session id for current Query. Used for logging purpose
          type: string
        typeahead_session_id:
          default: ""
          deprecated: true
          description: The legacy session id for current Query. Used for logging purpose
          type: string
      required:
      - query
      type: object
    files_v2.SearchV2ContinueArg:
      properties:
        api_app:
          anyOf:
          - $ref: '#/components/schemas/files_v2.ApiApp'
          - type: "null"
        cursor:
          default: ""
          description: The cursor returned by your last call to route SearchV2. Used
            to fetch the next page of results.
          format: byte
          type: string
      type: object
    files_v2.SearchV2Result:
      properties:
        cursor:
          description: Pass the cursor into route SearchContinueV2 to fetch the next
            page of results.
          format: byte
          type:
          - string
          - "null"
        has_more:
          default: false
          description: Used for paging. If true, indicates there is another page of
            results available that can be fetched by calling route SearchContinueV2
            with the cursor.
          type: boolean
        matches:
          description: A list (possibly empty) of matches for the query.
          items:
            $ref: '#/components/schemas/files.SearchMatch'
          type:
          - array
          - "null"
      type: object
    users_common.AccountId:
      maxLength: 40
      minLength: 40
      type: string
  securitySchemes:
    dropboxAppAuth:
      description: |-
        App-level OAuth 2.0 token (no user context). Use `Authorization: Bearer <token>`.

        Obtain by calling the token endpoint with `grant_type=client_credentials`.

        Only available on endpoints that declare app auth support.
      flows:
        clientCredentials:
          scopes:
            files.content.read: 'Required Dropbox scope: files.content.read'
            files.metadata.read: 'Required Dropbox scope: files.metadata.read'
          tokenUrl: https://api.dropboxapi.com/oauth2/token
      type: oauth2
    dropboxOAuth2:
      description: |-
        OAuth 2.0 token issued to a specific user. Use `Authorization: Bearer <token>`.

        Public clients should use the authorization code flow with PKCE (S256).

        For background or offline access, send `token_access_type=offline` during authorization and use the returned refresh token to obtain new access tokens.

        You can generate a short-lived access token in the Developer Console; see [Testing with a generated token](https://docs.dropboxapi.com/dropbox-api/docs/oauth#testing-with-a-generated-token).
      flows:
        authorizationCode:
          authorizationUrl: https://www.dropbox.com/oauth2/authorize
          scopes:
            files.content.read: 'Required Dropbox scope: files.content.read'
            files.content.write: 'Required Dropbox scope: files.content.write'
            files.metadata.read: 'Required Dropbox scope: files.metadata.read'
            files.metadata.write: 'Required Dropbox scope: files.metadata.write'
            files.permanent_delete: 'Required Dropbox scope: files.permanent_delete'
          tokenUrl: https://api.dropboxapi.com/oauth2/token
      type: oauth2
      x-fern-playground-description: You can generate a short-lived access token in
        the Developer Console; see [Testing with a generated token](https://docs.dropboxapi.com/dropbox-api/docs/oauth#testing-with-a-generated-token).
