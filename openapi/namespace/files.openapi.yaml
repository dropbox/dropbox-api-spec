          - string
          - "null"
        mode:
          anyOf:
          - $ref: '#/components/schemas/files.WriteMode'
          - type: "null"
          description: Selects what to do if the file already exists.
        mute:
          default: false
          description: |-
            Normally, users are made aware of any file modifications in their
             Dropbox account via notifications in the client software. If
             `true`, this tells the clients that this modification shouldn't
             result in a user notification.
          type: boolean
        path:
          $ref: '#/components/schemas/files.WritePathOrId'
          description: Path in the user's Dropbox to save the file.
        property_groups:
          description: List of custom properties to add to file.
          items:
            $ref: '#/components/schemas/file_properties.PropertyGroup'
          type:
          - array
          - "null"
        strict_conflict:
          default: false
          description: |-
            Be more strict about how each `WriteMode` detects conflict.
             For example, always return a conflict error when `mode`
             = `WriteMode.update` and the given "rev" doesn't match
             the existing file's "rev", even if the existing file has been
             deleted. This also forces a conflict even when the target path
             refers to a file with identical contents.
          type: boolean
      required:
      - path
      type: object
